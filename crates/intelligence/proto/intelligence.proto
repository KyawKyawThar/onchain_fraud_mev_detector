// The intelligence service's read contract (§8, §11): the synchronous
// lookups the public API service (and any other in-network caller) needs —
// an address's current risk score, its active labels, and the one-round-trip
// counterparty-screening bundle behind `POST /v1/address/{addr}/screen`.
// Nothing here is a command; every RPC is read-only, mirroring the
// store/cache seams behind it (`crate::store`, `crate::cache`) — this is a
// wire-level view onto them, not a second source of truth.
syntax = "proto3";

package intelligence.v1;

service IntelligenceRead {
  // Current risk score for an address (§8.3). Serves from the hot cache when
  // present; computes live (and repopulates the cache) on a miss.
  rpc GetRiskScore(RiskScoreRequest) returns (RiskScoreReply);

  // An address's active labels (§8.1), most-authoritative-first. Same
  // cache-aside behavior as GetRiskScore.
  rpc GetLabels(LabelsRequest) returns (LabelsReply);

  // Every decision input the synchronous counterparty-screening endpoint
  // (§11) needs for one address — score, confidence, labels, sanctions
  // matches and entity membership — in a single round-trip, because the
  // caller is the one latency-critical blocking surface in the API
  // (p50 < 100ms, §19). Facts only: the allow/review/block *decision* is the
  // API service's policy layer, not this service's. Cache-aside over one
  // Redis bundle (§8.3 hot path); a miss computes live and repopulates.
  rpc GetScreeningFacts(ScreeningFactsRequest) returns (ScreeningFactsReply);

  // The builder/relay leaderboard (§10, Sprint 11 t2): top builders by
  // confirmed sandwich volume, and each configured relay's market share by
  // MEV type. Aggregates the append-only block-production snapshots in
  // ClickHouse (latest-per-block, reverted excluded) — no cache, it's an
  // analytics scan, not a hot-path lookup.
  rpc GetBuilderLeaderboard(BuilderLeaderboardRequest) returns (BuilderLeaderboardReply);

  // The addresses connected to an entity, out to `hops` levels, as a
  // degree-capped subgraph (§8.2 — critical, §11). Walks the ClickHouse
  // adjacency store from the entity's members; a hub node (degree over the
  // cap) is a boundary the walk stops at, never a bridge it crosses.
  rpc GetEntityGraph(EntityGraphRequest) returns (EntityGraphReply);

  // The entity's curated milestone timeline (§8.4, §11): first seen,
  // classification/label changes, notable attributed incidents — a narrative
  // history projected from intelligence's own stores, distinct from the
  // incident-level audit trail.
  rpc GetEntityTimeline(EntityTimelineRequest) returns (EntityTimelineReply);

  // Addresses that behave like this one (§20.3, §8.3), each with the
  // behavioral factors that drove the match. Shortlists neighbours off the
  // ClickHouse vector index over `address_embeddings.vector`, then re-ranks
  // them exactly against the population baseline — so the score is in
  // standardized units, and `approximate` says whether the shortlist could
  // have missed a better neighbour.
  rpc GetSimilarAddresses(SimilarAddressesRequest) returns (SimilarAddressesReply);

  // The §20.3 clustering signal's proposals touching this address: behavioral
  // links to directly-known actors, each a reduced-confidence heuristic
  // awaiting a human (§8.1). Never a merge — an entity link still requires the
  // §8.2 on-chain evidence heuristics.
  rpc ListLinkCandidates(LinkCandidatesRequest) returns (LinkCandidatesReply);
}

message RiskScoreRequest {
  // 0x-prefixed hex address, any case.
  string address = 1;
}

message RiskScoreReply {
  // 0-100, "how risky".
  uint32 score = 1;
  // 0-1, "how sure" — never conflated with `score` (§8.3).
  double confidence = 2;
  string model_version = 3;
  // Unix milliseconds.
  int64 computed_at_unix_millis = 4;
}

message LabelsRequest {
  string address = 1;
}

message Label {
  string label_id = 1;
  string kind = 2;
  string value = 3;
  double confidence = 4;
  string source = 5;
  string source_detail = 6;
  // Unix milliseconds.
  int64 created_at_unix_millis = 7;
  // Unix milliseconds; absent (0 + present=false handled via optional) when the
  // label has no expiry.
  optional int64 valid_until_unix_millis = 8;
}

message LabelsReply {
  repeated Label labels = 1;
}

message ScreeningFactsRequest {
  // 0x-prefixed hex address, any case.
  string address = 1;
}

// One sanctions-list designation for the address (§8.5). Any entry at all is
// the hard-block signal that bypasses the caller's score thresholds.
message SanctionMatch {
  // Which list designated it (`ofac_sdn`, `eu_consolidated`, …).
  string list = 1;
  // The list's own entry (SDN name / programme).
  string entry = 2;
}

// One risk-score factor (§8.3): a signed contribution plus the evidence
// reference behind it. Mirrors `events::intelligence::RiskFactor` — the
// same explainability discipline carried onto the screening decision (§11,
// Sprint 14 t3), so a `block`/`review` is reconstructible without a second
// round trip to intelligence.
message RiskFactor {
  string name = 1;
  // Signed contribution to the score for this factor.
  double delta = 2;
  // Pointer to the evidence (incident id, label id, …) behind this factor.
  string evidence_ref = 3;
}

message ScreeningFactsReply {
  // 0-100, "how risky" (§8.3).
  uint32 score = 1;
  // 0-1, "how sure" — never conflated with `score` (§8.3).
  double confidence = 2;
  string model_version = 3;
  // Unix milliseconds.
  int64 computed_at_unix_millis = 4;
  // Sanctions-list matches; non-empty means sanctioned (§8.5 hard block).
  repeated SanctionMatch sanctions = 5;
  // The address's active labels (§8.1) — context for the decision record.
  repeated Label labels = 6;
  // The address's resolved entity (UUID string), absent when unclustered.
  optional string entity_id = 7;
  // Member count of that entity (0 when unclustered).
  uint32 entity_size = 8;
  // The full per-factor breakdown behind `score`, bounded the same way
  // `RiskScoreUpdated.factors` is (§8.3) — the explainability contract
  // `POST /v1/address/{addr}/screen` surfaces on a block/review (§11).
  repeated RiskFactor factors = 9;
}

message BuilderLeaderboardRequest {
  // Chain id (e.g. 1 = Ethereum mainnet).
  uint64 chain = 1;
  // Max builder rows to return; 0 means the server default (relays are always
  // returned in full — the configured set is small).
  uint32 limit = 2;
  // Optional recency floor (Unix milliseconds): only blocks whose latest
  // snapshot is at/after this instant count. Absent = all history.
  optional int64 since_unix_millis = 3;
}

message BuilderStats {
  // Payout address (feeRecipient), lowercase 0x-hex.
  string fee_recipient = 1;
  // Display name from intelligence labels; empty when unlabeled.
  string builder_label = 2;
  uint64 blocks_produced = 3;
  uint64 sandwich_count = 4;
  uint64 arb_count = 5;
  uint64 other_mev_count = 6;
  double mev_extracted_usd = 7;
}

message RelayStats {
  string relay = 1;
  uint64 blocks_delivered = 2;
  uint64 sandwich_count = 3;
  uint64 arb_count = 4;
  uint64 other_mev_count = 5;
  double mev_extracted_usd = 6;
  // Market share (0-1) of every relay-delivered block of each MEV type.
  double sandwich_share = 7;
  double arb_share = 8;
  double other_mev_share = 9;
}

message BuilderLeaderboardReply {
  // Ranked by sandwich volume, descending.
  repeated BuilderStats builders = 1;
  repeated RelayStats relays = 2;
}

message EntityGraphRequest {
  // The entity id (UUID string).
  string entity_id = 1;
  // Chain id to walk within (e.g. 1 = Ethereum mainnet).
  uint64 chain = 2;
  // Hops out from the entity's members; 0 means the server default. Clamped to
  // the server's hard ceiling.
  uint32 hops = 3;
}

message GraphNode {
  // 0x-prefixed lowercase hex address.
  string address = 1;
  // Distance from the nearest entity member (0 for a member).
  uint32 hop = 2;
  // This address is one of the entity's own members (a walk seed).
  bool is_seed = 3;
  // This address is a degree-capped hub — the walk stopped here (§8.2).
  bool is_hub = 4;
}

message GraphEdge {
  // Both endpoints, 0x-hex; `from` is the lexicographically smaller address.
  string from = 1;
  string to = 2;
}

message EntityGraphReply {
  // False when the entity is unknown (the edge maps this to a 404).
  bool found = 1;
  // The entity's member addresses — the walk's hop-0 seeds.
  repeated string seeds = 2;
  repeated GraphNode nodes = 3;
  repeated GraphEdge edges = 4;
  // The walk stopped early — more of the graph may exist beyond these nodes.
  bool truncated = 5;
  // Why the walk stopped short, if it did: any of `hub_boundary` (hit a
  // degree-capped hub), `hop_boundary` (more hops available — fetch deeper),
  // `node_budget` (too large — narrow the query). Empty = a complete graph.
  repeated string truncation_reasons = 6;
}

message EntityTimelineRequest {
  // The entity id (UUID string).
  string entity_id = 1;
}

message TimelineMilestone {
  // Milestone kind wire string: `first_seen` | `labeled` | `incident`.
  string kind = 1;
  // Unix milliseconds.
  int64 occurred_at_unix_millis = 2;
  // The member address this milestone concerns, 0x-hex; empty when entity-level.
  string address = 3;
  // A one-line narrative rendering of the milestone.
  string summary = 4;
  // A stable reference for the audit-trail hop (incident_id / label_id); empty
  // when none.
  string reference = 5;
}

message EntityTimelineReply {
  // False when the entity is unknown (the edge maps this to a 404).
  bool found = 1;
  // Milestones oldest first.
  repeated TimelineMilestone milestones = 2;
}

message SimilarAddressesRequest {
  // 0x-prefixed hex address, any case — the subject to find neighbours for.
  string address = 1;
  // Chain id whose embedding population to search (e.g. 1 = Ethereum mainnet).
  uint64 chain = 2;
  // How many neighbours to return; 0 means the server default. Clamped to the
  // server's ceiling rather than rejected.
  uint32 limit = 3;
}

// One feature's exact, signed share of a similarity score. The contributions
// of all features sum to `similarity` — this is the score's decomposition, not
// an attribution heuristic beside it.
message SimilarityFactor {
  // The feature's stable schema name (e.g. `busiest_day_share`).
  string feature = 1;
  // The subject's value in the vector's own raw, interpretable units.
  float subject_value = 2;
  // The neighbour's raw value.
  float candidate_value = 3;
  // The subject's value in robust z-units against the population baseline.
  float subject_z = 4;
  // The neighbour's value in robust z-units.
  float candidate_z = 5;
  // Signed share of the score. Positive: both sit on the same side of the
  // population median, pulling them together. Negative: opposite sides.
  float contribution = 6;
}

message SimilarAddress {
  // 0x-prefixed lowercase hex address.
  string address = 1;
  // The neighbour's resolved entity at its compute time; empty when it belongs
  // to none. A hit whose entity is known is the §20.3 clustering signal's
  // input — a reduced-confidence heuristic, never a merge (§8.2).
  string entity_id = 2;
  // Cosine similarity between baseline-standardized vectors, in [-1, 1].
  float similarity = 3;
  // This neighbour's vector describes a recent activity window rather than its
  // whole history (§8.2's hub rule) — a weaker claim, marked not assumed.
  bool observations_truncated = 4;
  // When the neighbour's vector was computed. Unix milliseconds.
  int64 computed_at_unix_millis = 5;
  // The largest-magnitude contributions, most significant first.
  repeated SimilarityFactor factors = 6;
}

message SimilarAddressesReply {
  // False when the subject has never been embedded under this version (the
  // edge maps this to a 404).
  bool found = 1;
  // The schema version and hash every vector in this reply was compared under.
  // Two scores are only comparable if both match.
  string embedding_version = 2;
  string schema_hash = 3;
  // When the subject's own vector was computed. Unix milliseconds.
  int64 subject_computed_at_unix_millis = 4;
  // Most similar first.
  repeated SimilarAddress results = 5;
  // How many rows the shortlist stage returned.
  uint32 candidates_considered = 6;
  // Shortlisted rows dropped during the re-rank: a superseded row for an
  // address already seen, a vector from another schema version, or one with no
  // signal to compare against.
  uint32 candidates_skipped = 7;
  // The shortlist filled its cap, so a better neighbour may exist outside it.
  // False means the search saw the whole comparable population and the ranking
  // is exact.
  bool approximate = 8;
  // Empty when the search ran. Otherwise why it could not, as a state rather
  // than an error: `no_baseline` (the population baseline for this version has
  // not been computed yet) or `no_signal` (the subject is at the population
  // median on essentially every feature, so there is no behavioral direction
  // to search along). `results` is empty in both cases and `found` is true —
  // the address exists, the comparison does not.
  string unavailable_reason = 9;
}

message LinkCandidatesRequest {
  // 0x-prefixed hex address, any case — the address whose proposals to list.
  string address = 1;
  // How many to return; 0 means the server default. Clamped to the ceiling
  // rather than rejected.
  uint32 limit = 2;
}

// One feature's signed share of the similarity behind a proposal. The
// contributions sum to `similarity` — the score's decomposition, not an
// attribution heuristic beside it.
message LinkFactor {
  string feature = 1;
  float subject_value = 2;
  float candidate_value = 3;
  float contribution = 4;
}

// One proposed behavioral link. The pair is unordered (`address_a` sorts before
// `address_b`); `anchor` names whichever side carried the directly-known actor
// label that made the pair worth proposing.
message LinkCandidate {
  string candidate_id = 1;
  string address_a = 2;
  string address_b = 3;
  string anchor = 4;
  // The anchor's label kinds at proposal time (`known_scammer`,
  // `sanctioned_entity`, `mev_bot`), frozen — a later revocation does not
  // rewrite why the proposal exists.
  repeated string anchor_labels = 5;
  // Each side's entity at proposal time; empty when unclustered. Both set and
  // different is the merge-candidate shape — still never a merge.
  string entity_a = 6;
  string entity_b = 7;
  // Cosine similarity between baseline-standardized vectors, in [-1, 1].
  float similarity = 8;
  // The §8.1 reduced-confidence band this signal is worth — always below the
  // entity-derived 0.5.
  double confidence = 9;
  string embedding_version = 10;
  string schema_hash = 11;
  repeated LinkFactor factors = 12;
  // `proposed` | `confirmed` | `rejected`. Only an operator moves it off
  // `proposed`.
  string status = 13;
  int64 proposed_at_unix_millis = 14;
  // Refreshed every time the proposal is rediscovered — "still true on every
  // sweep" is the strongest triage signal there is.
  int64 last_seen_at_unix_millis = 15;
  // Set once decided; empty/0 while the proposal is open.
  int64 decided_at_unix_millis = 16;
  string decided_by = 17;
  string decision_note = 18;
}

message LinkCandidatesReply {
  repeated LinkCandidate candidates = 1;
}
