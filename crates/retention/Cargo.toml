[package]
name = "retention"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The workspace's regulatory retention decision (engineering conventions §18):
# how long a SAR narrative and the evidence it cites must both live, as one
# validated value that both enforcing stores read. Pure arithmetic over typed
# instants — no store, no clock of its own — so the two enforcement sites
# (event-store's ClickHouse TTL and the copilot's Postgres purge) cannot drift
# apart. See src/lib.rs.

[lints]
workspace = true

[features]
# Reading the policy out of the environment. OFF by default: the arithmetic is
# the crate's reason to exist and needs only `chrono`, while `from_env` pulls in
# the whole observability stack through `telemetry`. A consumer that just wants
# to compute a deadline should not link an OTLP exporter to do it.
default = []
env = ["dep:telemetry", "dep:anyhow"]

[dependencies]
chrono = { workspace = true }
thiserror = { workspace = true }
# Owner identity for `PolicySet::for_artifact` — the per-jurisdiction seam.
# `uuid` and not `events::CustomerId`: this crate must stay linkable by anything
# that needs a date, including tooling that has no business knowing the domain
# schema.
uuid = { workspace = true }

anyhow = { workspace = true, optional = true }
# `telemetry::env` only, under the `env` feature.
telemetry = { workspace = true, optional = true }
