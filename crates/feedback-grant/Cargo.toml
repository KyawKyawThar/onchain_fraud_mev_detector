[package]
name = "feedback-grant"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The §19 feedback capability (readiness Epic E). Deliberately NOT part of
# `auth`: that crate verifies identity and refuses to mint, on the grounds that
# a library which does both invites a service to trust a token it issued
# itself. This one must do both — notification mints, the API service verifies
# — so the asymmetry is enforced by the key types instead (see src/lib.rs).
#
# A leaf: no axum, no runtime, nothing from the workspace. Either end can link
# it without inheriting the other's dependencies.

[dependencies]
jsonwebtoken = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
