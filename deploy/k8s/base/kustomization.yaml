# Base: the full platform topology (§20) — infra StatefulSets + one workload
# per service binary. Environment-specific concerns (Secrets, image tags,
# replica bumps) live in ../overlays/*; the base never carries a credential.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mev

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: mevwatch

resources:
  - namespace.yaml
  - app-config.yaml
  - infra/postgres.yaml
  - infra/redis.yaml
  - infra/clickhouse.yaml
  - infra/kafka.yaml
  - infra/rabbitmq.yaml
  - infra/prometheus.yaml
  - infra/alertmanager.yaml
  - infra/tempo.yaml
  - infra/grafana.yaml
  - services/ingestion.yaml
  - services/detection.yaml
  - services/event-store.yaml
  - services/event-store-repartition.yaml
  - services/simulation.yaml
  - services/intelligence.yaml
  - services/rule-engine.yaml
  - services/server.yaml
  - services/notification.yaml
  - services/usage.yaml
  - services/predictive.yaml
  - services/copilot.yaml
  - services/copilot-audit.yaml
  - services/copilot-retention.yaml
  - services/backup.yaml

# Dashboards/datasources feed both the compose Grafana and this in-cluster one
# from the same source files (deploy/grafana/...) — one place to edit, no
# drift between the two deploy targets (§19, Sprint 13 t4).
configMapGenerator:
  # The alert rules are generated from deploy/prometheus-rules.yml — the SAME
  # file the compose Prometheus loads — for the reason stated above the Grafana
  # block, and because the alternative was tried and failed. This manifest used
  # to inline its own copy of the rules "so the tree stays self-contained"; the
  # copy then drifted for three sprints. It was missing FastPathQueueWaitHigh,
  # FastPathSilent, ScreeningLatencyP50High and the entire copilot, backup,
  # embedding and clustering groups — and, worst of all, its FastPathLatencyHigh
  # still read `detector_detect_duration_seconds`, the series the 2026-09-07
  # load test proved cannot fire on the failure it names. The platform's
  # headline SLO alert was fixed in the compose file and left broken in the one
  # that actually runs in production. A rule is environment-agnostic (it does
  # not care how its targets were discovered), so there was never a second
  # version to maintain — only a second chance to be wrong.
  #
  # The name-suffix hash is deliberately kept: Prometheus does not watch its
  # rule files, so the hash changing on a rule edit is what rolls the pod and
  # makes the new rules actually load.
  - name: prometheus-rules
    files:
      - alerts.yml=../../prometheus-rules.yml
  - name: grafana-dashboards
    files:
      - ../../grafana/dashboards/api-service.json
      - ../../grafana/dashboards/billing-usage.json
      - ../../grafana/dashboards/block_production.json
      - ../../grafana/dashboards/detection.json
      - ../../grafana/dashboards/disaster-recovery.json
      - ../../grafana/dashboards/event-store.json
      - ../../grafana/dashboards/ingestion.json
      - ../../grafana/dashboards/intelligence.json
      - ../../grafana/dashboards/model-serving.json
      - ../../grafana/dashboards/notification.json
      - ../../grafana/dashboards/pipeline-overview.json
      - ../../grafana/dashboards/rule-engine.json
      - ../../grafana/dashboards/simulation.json
  - name: grafana-dashboard-provider
    files:
      - ../../grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-datasources
    files:
      - ../../grafana/provisioning/datasources/clickhouse.yml
      - ../../grafana/provisioning/datasources/prometheus.yml
      - ../../grafana/provisioning/datasources/tempo.yml
