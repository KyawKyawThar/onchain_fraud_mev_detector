# Shared non-secret configuration every service pod imports via `envFrom`.
# In-cluster addresses use plain Service DNS (§20 — service discovery via DNS
# in Kubernetes); anything credential-bearing lives in the Secrets the
# overlays provide (see ../overlays/dev/kustomization.yaml), never here.
#
# Per-pod values (CHAIN_ID overrides, *_METRICS_ADDR, consumer-group
# overrides) are set as explicit `env` entries on each Deployment — container
# `env` wins over `envFrom`, so a per-chain instance overrides cleanly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json # every pod logs one JSON line per event for the cluster log pipeline

  # Every binary serves /livez + /readyz here (telemetry::health, opt-in via
  # HEALTH_ADDR) — one port for every pod means one probe stanza shape.
  HEALTH_ADDR: 0.0.0.0:8086

  # Distributed tracing (§19, Sprint 13 t4): opt-in in crates/telemetry
  # (unset elsewhere keeps spans in-process only), defaulted ON here since
  # the in-cluster Tempo (infra/tempo.yaml) is part of this deployment.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318

  # ── Event backbone (Kafka, §2/§4) ─────────────────────────────
  KAFKA_BROKERS: kafka:9092
  # Topic topology event-store provisions on boot (§20). Sized for the capacity
  # plan's horizon, not today: a topic's count only grows, growing it re-maps
  # every business key, and chains occupy registered slots
  # (events::Chain::partition_slot) that stay put while the count exceeds them.
  # Pinned to crates/capacity/model.json by test. Replication is 1 while the
  # broker is a single-node KRaft StatefulSet.
  KAFKA_TOPIC_PARTITIONS: "12"
  KAFKA_TOPIC_REPLICATION: "1"
  KAFKA_RETENTION_MS: "604800000"

  # ── Event store ingest + storage (readiness Epic D capacity plan) ──
  # Rows per ClickHouse insert, and how long a record may wait for its batch.
  # Every insert is an on-disk part, so these two decide the insert rate the
  # capacity plan gates. Pinned to crates/capacity/model.json by test.
  EVENT_STORE_BATCH_MAX_ROWS: "10000"
  EVENT_STORE_BATCH_MAX_WAIT_MS: "1000"
  # Hot/cold tiering for the `events` table: all three, or none. Needs a server
  # storage policy with that volume (deploy/clickhouse/storage-tiered.xml).
  # EVENT_STORE_STORAGE_POLICY: tiered
  # EVENT_STORE_COLD_VOLUME: cold
  # EVENT_STORE_COLD_AFTER_DAYS: "90"

  # ── ClickHouse (event store + analytics, §14) ─────────────────
  # Credential-free HTTP base for the `clickhouse` Rust client; user/password/
  # db ride separately in the clickhouse-credentials Secret.
  CLICKHOUSE_HTTP_URL: http://clickhouse:8123

  # ── Regulatory retention (engineering conventions §18) ────────
  # ONE decision, read by BOTH stores that enforce it: event-store sets the
  # `events` table's TTL from it at boot, and the copilot purges
  # `copilot_drafts` and judges its grounding audit against it. Deliberately
  # unprefixed by service — a per-service override would split one compliance
  # decision in two, and the day they disagree is the day a SAR narrative
  # outlives the evidence under it.
  #
  # Both are commented out on purpose: the shipped defaults ARE the policy
  # (1827 days = five years from an artifact's disposition, per 31 CFR
  # 1020.320(d) and Directive (EU) 2015/849 art. 40, plus a 365-day margin so
  # evidence outlives the narratives written from it). Setting them here means
  # a cluster has deliberately departed from that, which is a reviewed change.
  # RETENTION_ARTIFACT_DAYS is a floor: a shorter value is refused at boot.
  # Raising RETENTION_EVIDENCE_MARGIN_DAYS is also what lengthens the events
  # TTL and so what makes an older backfill legitimate — it is one knob for
  # both, on purpose.
  # RETENTION_ARTIFACT_DAYS: "1827"
  # RETENTION_EVIDENCE_MARGIN_DAYS: "365"

  # ── Simulation work queue (RabbitMQ, §7) ──────────────────────
  RABBITMQ_SIM_QUEUE: sim.jobs
  RABBITMQ_SIM_DLX: sim.jobs.dlx
  RABBITMQ_SIM_DLQ: sim.jobs.dlq
  RABBITMQ_SIM_DELIVERY_LIMIT: "5"

  # ── Internal read APIs the api-service fronts (§11) ───────────
  EVENT_STORE_URL: http://event-store:8081
  # The copilot reads an incident's audit stream over the same internal read
  # API (§14: no cross-service joins) — its own var so the two consumers can
  # be pointed at different replicas if the read load ever justifies it.
  COPILOT_EVENT_STORE_URL: http://event-store:8081
  SIMULATION_URL: http://simulation-projection:8082
  INTELLIGENCE_GRPC_ADDR: http://intelligence-grpc:50051

  # ── Chain defaults ────────────────────────────────────────────
  # Ethereum-mainnet default; the per-chain instances (ingestion-base,
  # detection-base) override CHAIN_ID in their own env. Finality depth
  # defaults per chain in code (eth 64, base 1024) — no global override here.
  CHAIN_ID: "1"

  # ── api-service (§11) ─────────────────────────────────────────
  JWT_ISSUER: mev

  # ── Notification email channel (§11) ──────────────────────────
  # Relay host/from are deploy config; the credentials are in app-secrets.
  SMTP_HOST: smtp.example.internal
  SMTP_PORT: "587"
  SMTP_FROM: alerts@mevwatch.example

  # ── §19 feedback loop (readiness Epic E) ──────────────────────
  # Where a delivered alert's "was this right?" link points. Read by
  # notification only, and only together with FEEDBACK_GRANT_SECRET (boot
  # refuses one without the other). Override per environment.
  FEEDBACK_LINK_BASE: https://app.mevwatch.example
  # Incidents per thousand the platform ASKS about — the solicited cohort, the
  # only one whose false-positive rate can back a published claim.
  FEEDBACK_SOLICIT_PERMILLE: "50"

  # ── §10 block-production pipeline (intelligence) ──────────────
  # Public MEV-Boost relay data APIs; relay identity is configuration, never
  # code. Empty ⇒ header facts only.
  MEV_RELAY_ENDPOINTS: flashbots=https://boost-relay.flashbots.net,ultrasound=https://relay.ultrasound.money,agnostic=https://agnostic-relay.net

  # ── §8.5 sanctions freshness SLA (intelligence) ───────────────
  # The lists that must stay fresh, each `list[=max_age_secs]`; a bare name
  # takes INTEL_SANCTIONS_MAX_AGE_SECS (default 21600 = 6h). Read by the grpc
  # pods, which publish the SLA as `intel_sanctions_list_max_age_seconds` — the
  # SanctionsListStale alert's threshold. Removing a list here stops it being
  # monitored; it does not stop it being screened against.
  INTEL_SANCTIONS_LISTS: ofac_sdn,eu_consolidated
  # Where the hourly sanctions-sync CronJobs read each list. OFAC: the
  # community-standard extraction of the SDN digital-currency addresses. EU:
  # no public extraction exists — point this at the operator's own (plain
  # text, one 0x address per line). Until it resolves, the EU CronJob fails,
  # SanctionsListSyncFailing warns, and SanctionsListStale pages: claiming EU
  # coverage without an EU source is the gap the SLA exists to expose.
  # The checks a fetched version must pass before it replaces the live one.
  # Growth is the direction that matters: the live rows hard-block withdrawals,
  # so a wrong file's extra addresses are the damaging case, while a shrink
  # only removes designations the source no longer carries. A refused version
  # is staged, not discarded — an operator promotes it by digest after checking
  # upstream (`intelligence sanctions-promote`).
  INTEL_SANCTIONS_MAX_SHRINK_PERCENT: "20"
  INTEL_SANCTIONS_MAX_GROWTH_PERCENT: "100"
  INTEL_SANCTIONS_GROWTH_FLOOR: "500"
  # Addresses a list must always carry, `list:0xaddr,…;list:…` — the cheapest
  # check for "right URL, wrong file". Empty until the compliance team picks
  # designations they are confident are permanent.
  INTEL_SANCTIONS_SENTINELS: ""
  INTEL_SANCTIONS_OFAC_URL: https://raw.githubusercontent.com/0xB10C/ofac-sanctioned-digital-currency-addresses/lists/sanctioned_addresses_ETH.txt
  INTEL_SANCTIONS_EU_URL: https://sanctions.mevwatch.example/eu_consolidated_ETH.txt
