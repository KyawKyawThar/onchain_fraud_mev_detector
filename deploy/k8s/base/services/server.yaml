# ── api-service (`server`, §11) — the public REST/WS surface ───────────
# Stateless behind a load balancer (§20) → replicas + HPA. The one scaling
# subtlety is the WS fan-out consumer: every replica must see EVERY alert
# (each holds its own WS clients), so the Kafka group id is per-pod
# (suffixed with the pod name via the Downward API) — a shared group would
# partition-split the alert stream across replicas and WS clients would each
# see only a slice.
apiVersion: v1
kind: Service
metadata:
  name: api-server
  labels:
    app.kubernetes.io/name: api-server
spec:
  selector:
    app.kubernetes.io/name: api-server
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  labels:
    app.kubernetes.io/name: api-server
spec:
  # No `replicas`: the HPA owns the count. With a literal here every `kubectl
  # apply` re-applies it and resets a scaled-out pool, most likely mid-incident,
  # since that is when people deploy (crates/arch-conformance/tests/deploy_scaling.rs).
  selector:
    matchLabels:
      app.kubernetes.io/name: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-server
        app.kubernetes.io/part-of: mevwatch
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Keep API replicas off detection's nodes where the scheduler can. The
      # 2026-09-07 load test measured the fast path at 250ms with the API idle
      # and 1.000s — exactly the §6 budget — with API load co-resident, all of
      # it queue wait. An HPA adding API pods is what creates that neighbour, so
      # the pods it adds should land elsewhere. Preferred, not required: on a
      # cluster too small to separate them, serving the API still wins.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: detection
      containers:
        - name: server
          image: ghcr.io/kyawkyawthar/onchain_fraud_mev_detector/server:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVER_KAFKA_GROUP
              value: api-service-ws-$(POD_NAME)
            - name: SERVER_HOST
              value: 0.0.0.0
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_METRICS_ADDR
              value: 0.0.0.0:9100
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            # Screening endpoint's dedicated rate limiter (§19, Sprint 14 t4)
            # — same secret intelligence/rule-engine already read Redis from.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8086
            - name: metrics
              containerPort: 9100
          startupProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
# CPU is the scaling input, and deliberately the only one.
#
# What an API pod runs short of is its own compute: JWT verification, policy
# evaluation, serialization. Its I/O waits on intelligence and event-store, and
# more API replicas do not make those faster — they send them more concurrent
# load. So there is no latency input: when intelligence is slow, a latency-driven
# HPA would add pods that make it slower.
#
# No qps input yet, for lack of a number rather than a signal: a per-pod qps
# target is a claim about how much one pod serves, and the only measurement
# (2026-09-07, 100 qps, five services and the generator sharing one laptop) is
# explicitly not a capacity claim. Add `http_requests_total` as a Pods metric
# once the Epic D staging run has measured per-pod throughput.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-server
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Scale-down removes one pod every two minutes. Every WebSocket client on a
  # removed pod reconnects at once to the survivors, so pacing removals caps
  # that reconnect storm at one pod's share. Scale-up keeps the aggressive
  # default: an API short of pods is failing requests now.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-server
