# ── simulation (§7) — dispatcher, worker pool, projection ──────────────
# Three binaries, three scaling shapes:
#   dispatcher   — Kafka consumer publishing SimulationJob commands; 1 is plenty
#   worker       — revm CPU is THE bottleneck (§20 "scale aggressively"):
#                  competing consumers on the sim.jobs quorum queue, so
#                  replicas scale linearly → HPA on queue depth (§7's own
#                  backpressure signal) and CPU
#   projection   — incidents read model (Postgres+ClickHouse) + internal
#                  GET /v1/incidents the api-service fronts
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-dispatcher
  labels:
    app.kubernetes.io/name: simulation-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simulation-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulation-dispatcher
        app.kubernetes.io/part-of: mevwatch
        app.kubernetes.io/component: simulation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          image: ghcr.io/kyawkyawthar/onchain_fraud_mev_detector/simulation:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_URL
            - name: SIMULATION_METRICS_ADDR
              value: 0.0.0.0:9100
          ports:
            - name: health
              containerPort: 8086
            - name: metrics
              containerPort: 9100
          startupProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-worker
  labels:
    app.kubernetes.io/name: simulation-worker
spec:
  # No `replicas`: the HPA owns the count. With a literal here every `kubectl
  # apply` re-applies it and resets a scaled-out pool, most likely mid-incident,
  # since that is when people deploy (crates/arch-conformance/tests/deploy_scaling.rs).
  selector:
    matchLabels:
      app.kubernetes.io/name: simulation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulation-worker
        app.kubernetes.io/part-of: mevwatch
        app.kubernetes.io/component: simulation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # A job already taken runs to its settle on SIGTERM (Worker::run only
      # observes shutdown between jobs), and one whose results land inside this
      # window is acked, not re-run. Prefetched, unstarted jobs go straight back
      # to the queue. Derived, not guessed: it must cover the job deadline
      # (SIMULATION_JOB_DEADLINE_SECS, 45s) + one transaction of overshoot (5s)
      # + two result publishes at the 30s Kafka send timeout = 110s.
      # crates/simulation/tests/grace_period.rs fails the build if it does not.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: ghcr.io/kyawkyawthar/onchain_fraud_mev_detector/simulation-worker:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_URL
            # Per-replica concurrency; horizontal scale is replicas (HPA below).
            # SIMULATION_WORKERS x RABBITMQ_PREFETCH (default 16) is exported
            # as simulation_worker_job_capacity, the HPA's per-replica unit —
            # changing either moves the scaling point. Prefetch is therefore
            # also the latency knob: it is how much queueing one replica
            # absorbs before another is asked for.
            - name: SIMULATION_WORKERS
              value: "4"
            - name: SIMULATION_WORKER_METRICS_ADDR
              value: 0.0.0.0:9100
          ports:
            - name: health
              containerPort: 8086
            - name: metrics
              containerPort: 9100
          startupProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
# The one true horizontal scaler in the system: workers are interchangeable
# competing consumers, so replicas add throughput linearly.
#
# Two inputs; the HPA takes whichever asks for more:
#   - sim.jobs depth, the signal §7 designed for this. External metric served by
#     prometheus-adapter (deploy/k8s/cluster/) from the recording rule
#     `simulation:sim_jobs_replicas_demanded` in deploy/prometheus-rules.yml:
#     (ready + unacked) / simulation_worker_job_capacity, i.e. replicas needed
#     to hold the queue inside each replica's declared bound. AverageValue 1
#     means "no replica over its bound", so the target is the deployment's
#     own prefetch, not a number chosen here.
#   - CPU, kept for what depth cannot see: a few pathological jobs pinning
#     every core while the queue looks short.
# CPU alone lagged the backlog: a replica whose prefetch windows are full but
# whose jobs are waiting on the resolver shows neither high CPU nor progress.
#
# If the external metric is unreadable (adapter or Prometheus down), the HPA
# keeps scaling up on CPU and does not scale down — it holds capacity rather
# than drain it. SimulationQueueSignalDown / SimulationBacklogOutgrowingWorkers.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simulation-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simulation-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: External
      external:
        metric:
          name: simulation_sim_jobs_replicas_demanded
        target:
          type: AverageValue
          averageValue: "1"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Scale-up keeps the Kubernetes default (no stabilization, up to double or +4
  # pods every 15s): §20 says scale aggressively, and an idle extra worker costs
  # only its request.
  #
  # Scale-down is paced to one pod a minute after the default 5m window. The
  # removed pod drains its in-flight job first (up to the grace period), and a
  # burst that has just drained usually arrives again within minutes; removing
  # half the pool at once would mean restarting them — 150s of startup budget
  # each — for the next one.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: simulation-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simulation-worker
---
apiVersion: v1
kind: Service
metadata:
  name: simulation-projection
  labels:
    app.kubernetes.io/name: simulation-projection
spec:
  selector:
    app.kubernetes.io/name: simulation-projection
  ports:
    - name: http
      port: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-projection
  labels:
    app.kubernetes.io/name: simulation-projection
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simulation-projection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulation-projection
        app.kubernetes.io/part-of: mevwatch
        app.kubernetes.io/component: simulation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: projection
          image: ghcr.io/kyawkyawthar/onchain_fraud_mev_detector/simulation-projection:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: clickhouse-credentials
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            - name: SIMULATION_PROJECTION_HTTP_HOST
              value: 0.0.0.0
            - name: SIMULATION_PROJECTION_HTTP_PORT
              value: "8082"
            - name: SIMULATION_PROJECTION_METRICS_ADDR
              value: 0.0.0.0:9100
          ports:
            - name: http
              containerPort: 8082
            - name: health
              containerPort: 8086
            - name: metrics
              containerPort: 9100
          startupProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: health }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
