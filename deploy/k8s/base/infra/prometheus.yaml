# ── Prometheus (metrics scrape + SLO alert rules, §19, Sprint 13 t4) ────
# In-cluster twin of deploy/prometheus.yml, but target discovery is
# `kubernetes_sd_configs: role: pod` with relabeling on the `prometheus.io/
# scrape` + `prometheus.io/port` annotations every service pod already
# carries (§20's t4 hook) — one scrape job covers every annotated pod instead
# of a static target per service. Plain RBAC (ServiceAccount + ClusterRole to
# list/watch pods), no Prometheus Operator/CRDs — consistent with how Kafka/
# RabbitMQ/etc. are hand-rolled StatefulSets rather than operator-managed.
#
# Alert rules are NOT inlined here. They are generated straight from
# deploy/prometheus-rules.yml by the `prometheus-rules` configMapGenerator in
# ../kustomization.yaml — the same single source the compose Prometheus loads,
# exactly as the Grafana dashboards already work. This tree used to carry its
# own inline copy for self-containment; it drifted badly enough that production
# was running a materially different (and in one case structurally broken)
# rule set from the one under review. See that generator for the details.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mev-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mev-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mev-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [mev]
        relabel_configs:
          # Only pods that opted in via the annotation (§20's t4 hook).
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Default to the pod IP's :9100, but honor an explicit
          # prometheus.io/port annotation when the pod uses a different one.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      # RabbitMQ sim.jobs queue depth (§7/§20) — the broker's own plugin, not
      # a pod annotation (its Service is what's stable, not an ephemeral pod).
      - job_name: rabbitmq
        metrics_path: /metrics/per-object
        static_configs:
          - targets: ["rabbitmq:15692"]
            labels:
              service: simulation
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: mevwatch
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: prometheus
      # The image's user is `nobody` by NAME, which the kubelet cannot check
      # against runAsNonRoot; without a numeric uid it refuses to start the
      # container, and Prometheus (now on the autoscaling path) never ran here.
      # fsGroup keeps the data PVC writable for that uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        # Projected, because the config and the rules now come from two
        # ConfigMaps (the rules are generated from deploy/prometheus-rules.yml)
        # and Prometheus wants them under one tree: /etc/prometheus/prometheus.yml
        # and /etc/prometheus/rules/alerts.yml, which is what `rule_files` above
        # points at.
        - name: config
          projected:
            sources:
              - configMap:
                  name: prometheus-config
                  items:
                    - key: prometheus.yml
                      path: prometheus.yml
              - configMap:
                  name: prometheus-rules
                  items:
                    - key: alerts.yml
                      path: rules/alerts.yml
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
