# ── prometheus-adapter — external metrics for HPAs (Epic D, §7/§20) ─────
# Serves `external.metrics.k8s.io` from the in-cluster Prometheus so the
# simulation-worker HPA can scale on sim.jobs depth. Hand-rolled Deployment +
# RBAC + APIService, no operator and no CRDs, the same posture as the rest of
# the tree.
#
# Why this and not KEDA: KEDA's RabbitMQ scaler reads the broker directly and
# keeps Prometheus out of the scaling path, but it is an operator with CRDs
# that owns the HPA object. Here the HPA stays a plain autoscaling/v2 object
# next to its Deployment, and the scaling expression is a recording rule in
# deploy/prometheus-rules.yml, the same file the alert that watches it lives in.
# The cost is that Prometheus (single instance, §19) is now on the scaling path.
# That fails safe: an HPA that cannot read an external metric keeps scaling UP
# on its CPU metric and refuses to scale DOWN, so an outage holds capacity and
# never drains it. `SimulationQueueSignalDown` covers the other half.
#
# Only the external metrics API is registered. custom.metrics.k8s.io is not
# used by any HPA here, and an aggregated API nobody reads is surface without
# a purpose.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-adapter
  namespace: mev
---
# Delegated authn/authz: the adapter asks the API server who a caller is and
# whether they may read metrics, rather than keeping its own policy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mev-prometheus-adapter:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: mev
---
# Reads the front-proxy CA from kube-system, which is how the adapter verifies
# that a request really came through the aggregator. MUST stay in kube-system —
# see ./kustomization.yaml for why this file is not under a namespace transformer.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mev-prometheus-adapter-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: mev
---
# Discovery/REST mapping for the resources a metric can be associated with.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mev-prometheus-adapter-resource-reader
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, services, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mev-prometheus-adapter-resource-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mev-prometheus-adapter-resource-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: mev
---
# The HPA controller is the one reader. Granting it here, rather than relying on
# a distribution's defaults, makes the dependency visible.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mev-external-metrics-reader
rules:
  - apiGroups: [external.metrics.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mev-hpa-external-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mev-external-metrics-reader
subjects:
  - kind: ServiceAccount
    name: horizontal-pod-autoscaler
    namespace: kube-system
---
# One rule per scaling signal. The PromQL lives in the recording rule, not here:
# this file only names what the API exposes. Colons are legal in a Prometheus
# name but not in the metric segment of an API path, hence the rename.
# `namespaced: false` because the recorded series is aggregated away from any
# namespace label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: mev
data:
  config.yaml: |
    externalRules:
      - seriesQuery: '{__name__="simulation:sim_jobs_replicas_demanded"}'
        name:
          matches: "^simulation:sim_jobs_replicas_demanded$"
          as: "simulation_sim_jobs_replicas_demanded"
        resources:
          namespaced: false
        metricsQuery: 'max(<<.Series>>{<<.LabelMatchers>>})'
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-adapter
  namespace: mev
  labels:
    app.kubernetes.io/name: prometheus-adapter
spec:
  selector:
    app.kubernetes.io/name: prometheus-adapter
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
  namespace: mev
  labels:
    app.kubernetes.io/name: prometheus-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-adapter
        app.kubernetes.io/part-of: mevwatch
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: prometheus-adapter
      # The image's own uid, stated explicitly (crates/arch-conformance/tests/
      # deploy_users.rs): runAsNonRoot is only verifiable against a number.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.12.0
          args:
            - --secure-port=6443
            # Self-signed serving cert written at start; the APIService below
            # skips verification of it (the aggregator-to-adapter hop is
            # in-cluster; the caller's identity is verified by the front-proxy
            # CA, not by this cert).
            - --cert-dir=/tmp/cert
            - --prometheus-url=http://prometheus.mev.svc:9090/
            - --metrics-relist-interval=1m
            - --config=/etc/adapter/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: https
              containerPort: 6443
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: https, scheme: HTTPS }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/adapter
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-adapter-config
        - name: tmp
          emptyDir: {}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
spec:
  group: external.metrics.k8s.io
  version: v1beta1
  service:
    name: prometheus-adapter
    namespace: mev
    port: 443
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
