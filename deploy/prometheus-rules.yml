# SLO alert rules (§19, Sprint 13 t4; production_readiness.md Epic D — "Define
# SLOs ... turn them into targets"). Loaded by deploy/prometheus.yml's
# `rule_files`, evaluated by Prometheus, routed through Alertmanager
# (deploy/alertmanager.yml).
#
# ── Where these numbers come from (calibrated 2026-09-11) ───────────────────
#
# Every threshold below is one of exactly three things, and each rule names
# which. There is no fourth category; a number that is none of these does not
# belong in this file.
#
#   1. A PUBLISHED CLAIM — §6's fast path < 1s p99, §19's screening p50
#      < 100ms. These are promises about the product. Load does not move them;
#      it only says whether we are keeping them.
#
#   2. AN EXPORTED GAUGE — `model_drift_threshold`, `backup_objective_seconds
#      {kind="budget"}`, `event_store_evidence_retention_days`. The rule
#      compares two *series*, so the deployment's own configuration IS the
#      threshold and the two cannot drift apart. A literal in these rules would
#      be a second definition of the same policy, wrong for anyone who tuned
#      theirs and silently stale the moment the default moves.
#
#   3. A MEASUREMENT — the 2026-09-07 `mainnet-peak` load-test run
#      (`crates/loadtest`, docs/runbooks/load-test.md): 4 blocks/s, 1001
#      declared tps, 1200 alerting samples, 100 API qps, every service and the
#      generator co-resident on one dev host. It measured:
#
#        fast path p99 bound   0.250s  API idle    →  1.000s  API loaded
#        detection queue wait  0.0025s API idle    →  0.500s  API loaded
#        API p99 share         0.974 against the 0.500s budget  (breached)
#        API success ratio     0.883 against the 0.990 budget   (breached)
#
#      A 4x fast-path degradation landing exactly on the published budget,
#      driven entirely by contention the fast path does not control. That run
#      is NOT a production capacity claim — it is the proof that the instrument
#      moves at all, and the numbers it produced are what the rules below are
#      calibrated against. The budgets it checks live in crates/loadtest/
#      slo.json; where a rule watches a series that file also gates on, the two
#      carry the SAME number on purpose, so the nightly job and Alertmanager
#      cannot come to different conclusions about the same SLO.
#
# ── The bucket-ladder rule (this is a correctness constraint, not style) ────
#
# EVERY LATENCY THRESHOLD MUST LAND ON A BOUNDARY of
# `telemetry::metrics::LATENCY_BUCKETS_SECONDS` — ..., 0.1, 0.25, 0.5, 1.0,
# 2.5, 5.0, 10.0 — which every `_seconds` histogram in the platform shares.
# `histogram_quantile` interpolates *inside* a bucket, so a threshold between
# two rungs is compared against a number the histogram never observed. Worse, a
# threshold ABOVE 10.0 can never fire at all: a quantile falling in the `+Inf`
# bucket reports the highest finite bound, so the expression is capped at 10
# whatever it names. Two rules here were exactly that — `AlertEndToEndLatency
# High` at 30s and `EmbeddingSweepLapTooSlow` at 6h, both structurally incapable
# of firing since the day they were written. This is the same defect class as
# the pre-2026-09-07 `FastPathLatencyHigh`, which watched a series a backlog
# could not move. Both are fixed below; a lap measured in hours cannot be
# expressed on a 10s ladder at all, so that SLI moved to a gauge.
#
# ── What is still uncalibrated, and says so ─────────────────────────────────
#
# The load test drives the chain and the API. It does NOT drive simulation,
# embeddings, clustering, the copilot, or notification delivery — so nothing in
# those groups is measurement-backed, and none of them pretends to be. They
# survive on category 2 (compared against the deployment's own configured
# number) or on a structural condition: a count of something that should be
# zero, or two series that contradict each other. Rules that had neither — an
# invented number attached to an *observation* rather than a fault — have been
# deleted rather than left as green decoration. A rule nobody can act on
# teaches operators to ignore the ones they can.
#
# ── These constraints are a TEST, not this comment ──────────────────────────
#
# `crates/alert-conformance` parses this file and fails `cargo test` on: a
# quantile threshold off its metric's ladder or above its ceiling; a batch-job
# series read through a window narrower than the job's cadence, or through
# `increase`/`rate` instead of `max_over_time`; an unroutable severity; a new
# `informational` rule; a missing annotation; a duplicate alert name.
#
# It reads `telemetry::metrics::buckets_for` rather than a copy of the ladder,
# so a threshold is always checked against the boundaries its metric is really
# exported on. Everything in this header existed as prose first, and prose is
# how four unfireable rules got here — see engineering conventions §19b.
#
# ── Severity is a response, not a confidence level ──────────────────────────
#
# `page` = wake someone now. `warning` = look at this today. `informational` is
# no longer the parking space for "we have not tuned this yet": exactly one
# rule below carries it, and it does so because over-retention is genuinely the
# milder failure — an argued severity, not an unpicked number.
groups:
  - name: mevwatch-slo
    rules:
      # The §6 claim, on the series that can actually break it.
      #
      # This rule previously read `detector_detect_duration_seconds` — one
      # `detect` call. That is microseconds on a header-only block and is
      # *unchanged* by a queue building up in front of it, so the alert was
      # structurally incapable of firing on the failure it names: blocks
      # backing up behind detection would leave it green while alerts arrived
      # seconds late. `detection_fast_path_duration_seconds` spans the broker
      # hop and the scheduler's bounded work channel, which is where a
      # saturated pipeline's latency actually accumulates.
      #
      # `outcome="alert"` because §6 claims a *preliminary alert* within a
      # second; a block in which no detector fired is not evidence either way.
      - alert: FastPathLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(detection_fast_path_duration_seconds_bucket{outcome="alert"}[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Fast path p99 exceeds the §6 <1s SLO"
          description: "detection_fast_path_duration_seconds{outcome=\"alert\"} p99 (block occurred_at → alert published) has been above 1s for 5m. This is the platform's headline latency claim. Split it: detection_queue_wait_seconds large ⇒ detection is the bottleneck (roster cost, rayon backlog); detection_block_process_seconds large ⇒ the work or the publish path; both small ⇒ the time is outside the process (broker transit, consumer lag, or clock skew between ingestion and detection). docs/runbooks/load-test.md."

      # The backpressure term on its own — CALIBRATED (category 3), and the
      # clearest thing the 2026-09-07 run changed.
      #
      # This was 0.5, chosen as "half the §6 budget" before anything had been
      # measured. The run then measured queue wait at *exactly* 0.500s in the
      # same window the fast path reached 1.000s — so the old threshold fired
      # simultaneously with `FastPathLatencyHigh`, or a beat after it. A leading
      # indicator that leads by nothing is just a second page for one incident.
      #
      # Healthy is 0.0025s (same profile, API idle). 0.25 is the next ladder
      # rung down: 100x the measured healthy value, so ordinary variation will
      # not reach it, and half the measured degraded value, so it fires while
      # the total still has headroom — which is the entire job of this rule.
      - alert: FastPathQueueWaitHigh
        expr: |
          histogram_quantile(0.99, sum(rate(detection_queue_wait_seconds_bucket[5m])) by (le)) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Blocks are queueing in front of detection"
          description: "detection_queue_wait_seconds p99 above 250ms for 10m — a quarter of the §6 budget is being spent before a detector runs, against a measured healthy value of 2.5ms. The bounded work channel is filling. Act now: at 500ms of queue wait the 2026-09-07 load test had the fast path sitting on its 1s budget, and FastPathLatencyHigh is next. What the load test found doing this to a healthy pipeline was contention from a co-resident API, NOT anything detection controls — check what else is scheduled on these nodes before tuning the roster."

      # Monitoring the monitor (engineering conventions §15): a fast path that
      # stopped producing samples and a fast path with nothing to report render
      # identically on a quantile, because a histogram with no new observations
      # holds its last value. A detection instance that has stopped consuming
      # is the most consequential silent failure in the platform.
      - alert: FastPathSilent
        expr: |
          sum(rate(detection_fast_path_duration_seconds_count[10m])) by (chain) == 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Detection has recorded no fast-path samples for 15m"
          description: "No block has completed the fast path on chain {{ $labels.chain }} in 15 minutes. Either ingestion stopped producing BlockAssembled or detection stopped consuming — the latency panels will look healthy either way, because a quantile over no samples reports the last one."

      # CALIBRATED (category 3). Was 1s, "a placeholder pending a real SLA".
      # The SLA it was waiting for already existed: crates/loadtest/slo.json
      # declares `api_p99_seconds: 0.5`, and the 2026-09-07 run BREACHED it
      # (p99 share 0.974 against a 0.99 floor) while this alert sat green,
      # because it was watching the same series through a threshold twice as
      # loose. That is the disagreement `FastPathLatencyHigh` was rewired to
      # eliminate, repeated on the API: the nightly job fails, the dashboard
      # says fine, and nobody can say which one is lying.
      #
      # 0.5 is a ladder boundary and is now the single definition of the API
      # p99 budget — change it here and in slo.json together, or not at all.
      - alert: ApiLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "api-service p99 request latency is over its 500ms budget"
          description: "http_request_duration_seconds p99 has been above 500ms for 5m — the budget in crates/loadtest/slo.json (api_p99_seconds), which the nightly load test gates on with this same number. Note this is the aggregate across routes; ScreeningLatencyP50High is the contractual one (§11 sits inline on customer withdrawals). If both fire, treat the screening path first."

      # CALIBRATED (category 3) — a rule the measurement demanded and that did
      # not exist. The 2026-09-07 run measured an API success ratio of 0.883
      # against slo.json's `min_api_success_ratio: 0.99`, driven by event-store
      # 5xx under load. The load test could see that; Prometheus could not,
      # because nothing here watched http_requests_total at all. A latency
      # panel is blind to this by construction — a fast 500 is fast.
      - alert: ApiErrorRatioHigh
        expr: |
          sum(rate(http_requests_total{status="5xx"}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.01
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Over 1% of API requests are failing"
          description: "The 5xx share of http_requests_total has been above 1% for 5m — the complement of slo.json's min_api_success_ratio (0.99), carrying the same number so the nightly gate and this alert agree. 4xx is deliberately excluded: a client sending bad requests is not an outage. The 2026-09-07 load test reached 0.883 success here, and the cause was upstream — the API proxies event-store and simulation-projection (§11), so check those before api-service itself, and check http_requests_total by `route` to see whether one upstream or all of them."

      - alert: ScreeningLatencyP50High
        expr: |
          histogram_quantile(0.5,
            sum(rate(http_request_duration_seconds_bucket{route="/v1/address/{address}/screen"}[5m])) by (le)
          ) > 0.1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Screening endpoint p50 latency exceeds the §19 <100ms SLO"
          description: "http_request_duration_seconds{route=\"/v1/address/{address}/screen\"} p50 has been above 100ms for 5m — this is the headline synchronous-screening SLO (§19), not a placeholder. Check the screening rate limiter (§rate_limit's SCREENING_RATE_LIMIT_ERRORS_TOTAL — a failing-open Redis adds no latency itself, but a saturated/slow Redis can) and the intelligence gRPC deadline/cache hit rate first. If ScreeningServingStaleFacts is firing too, intelligence is the cause and degradation is absorbing it: stale answers arrive at SCREENING_FRESH_BUDGET_MS (150ms by default), which is above this threshold by design. The same number gates the nightly load test as slo.json's screen_p50_seconds."

      # PUBLISHED CLAIM (category 1) — readiness Epic D's "bounded p99 budget
      # under load" for the one API surface whose latency is contractual. 0.25
      # is a ladder boundary and the single definition of that budget:
      # crates/loadtest/slo.json's `screen_p99_seconds` gates a load run on the
      # same number, and server::config sizes the degradation defaults to land
      # inside it (150ms fresh budget + 25ms snapshot read = 175ms, pinned by a
      # unit test there). Change all three together, or not at all. Not yet a
      # measurement: the nightly `ci-fastpath` profile drives no API, so this
      # holds only as far as a `mainnet-peak` run has been made to show it.
      #
      # Why a p99 rule beside the p50 one: degradation makes a slow intelligence
      # *bounded*, not fast. Without it the tail sat at SCREENING_DEADLINE_MS
      # (500ms); with it, a request with a snapshot is answered by ~175ms, and
      # one without still waits the deadline. A breach here while stale serving
      # is also firing means the snapshot substrate is thin — see
      # screening_snapshot_lookups_total{result="missing"}.
      - alert: ScreeningLatencyP99High
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{route="/v1/address/{address}/screen"}[5m])) by (le)
          ) > 0.25
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Screening endpoint p99 latency exceeds its 250ms budget"
          description: "http_request_duration_seconds{route=\"/v1/address/{address}/screen\"} p99 has been above 250ms for 5m — slo.json's screen_p99_seconds. Customer withdrawals are waiting on this call. Look at screening_degraded_total by outcome: served_fresh_late or failed_closed growing means requests with no usable snapshot are riding the full SCREENING_DEADLINE_MS (check screening_snapshot_lookups_total{result=\"missing\"} and ScreeningSnapshotWritesLost); neither growing means the slowness is in the API service itself (policy-store Postgres, rate-limiter Redis) rather than intelligence."

      # STRUCTURAL — a count that should be zero. Every stale screening
      # decision is a withdrawal decided on facts intelligence could not confirm
      # in time, so there is no healthy non-zero rate to calibrate against.
      # `warning`, not `page`: customers are being answered, and each answer is
      # flagged — the incident is intelligence's, and its own rules page for it.
      - alert: ScreeningServingStaleFacts
        expr: sum(rate(screening_facts_served_total{freshness="stale"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Screening decisions are being rendered over last-known-good facts"
          description: "For 10m, /screen has been answering from Redis snapshots because intelligence is slow or unavailable (server::degrade). Customers receive stale: true with the facts' age; anything that changed since — including a new sanctions designation — is not reflected, bounded by SCREENING_STALE_MAX_AGE_SECS. Break down screening_degraded_total by reason (intelligence_slow vs intelligence_unavailable) and fix intelligence; this clears on its own when fresh reads return inside SCREENING_FRESH_BUDGET_MS."

      # STRUCTURAL — should be zero. A withdrawal that could be answered neither
      # fresh nor from a snapshot got a 502. ApiErrorRatioHigh sees this only
      # past 1% of *all* API traffic, where screening can be a small share.
      - alert: ScreeningFailingClosed
        expr: sum(rate(screening_degraded_total{outcome="failed_closed"}[5m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Screening calls are failing closed — customer withdrawals are getting 502s"
          description: "Intelligence is slow or unavailable AND no usable last-known-good snapshot exists for the addresses being screened, so /screen is returning 502 rather than a decision (it never allows by default). Restore intelligence first. screening_snapshot_lookups_total by result says why the fallback had nothing: missing (never screened, or ScreeningSnapshotWritesLost), too_old (outage longer than SCREENING_STALE_MAX_AGE_SECS), or error (Redis). If screening_degradation_enabled is 0, degradation is switched off and every intelligence fault lands here."

      # STRUCTURAL (§15) — should be zero. The fallback's substrate fails open:
      # a lost write costs a future stale answer, never a present decision,
      # which is exactly why it must be visible. Otherwise the first sign would
      # be ScreeningFailingClosed during the next intelligence incident.
      - alert: ScreeningSnapshotWritesLost
        expr: sum(rate(screening_snapshot_writes_lost_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Last-known-good screening snapshots are not being saved"
          description: "screening_snapshot_writes_lost_total is increasing: cause=\"queue\" means the writer is behind (raise SCREENING_SNAPSHOT_CHANNEL_CAPACITY or check Redis latency), cause=\"store\" means Redis is refusing writes. Screening decisions are unaffected right now; the next intelligence incident will find older or missing snapshots and fail closed more often."

      # §15b arming state, read explicitly rather than inferred from absence
      # (same shape and the same severity argument as CopilotTokenBudgetDisarmed).
      # A disarmed deployment exports no stale or degradation series at all, so
      # the three rules above are green for that reason alone.
      # STRUCTURAL — the breaker is a state, not a threshold anyone tuned. Open
      # means consecutive intelligence reads were failing or slower than the
      # fresh budget ceiling, and /screen is answering straight from snapshots
      # without trying intelligence first (server::facts_source). Customers are
      # served (ScreeningServingStaleFacts fires beside this); this rule names
      # the cause, so it is `warning` — intelligence's own rules page.
      - alert: ScreeningIntelligenceBreakerOpen
        expr: max(screening_intelligence_breaker_state) == 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The API service has stopped calling intelligence for screening (circuit open)"
          description: "screening_intelligence_breaker_state has been 2 (open) for 5m on at least one API pod: SCREENING_BREAKER_FAILURE_THRESHOLD consecutive screening reads failed or answered slower than SCREENING_FRESH_BUDGET_MS, so /screen serves last-known-good snapshots immediately and probes intelligence once every SCREENING_BREAKER_COOLDOWN_SECS. Fix intelligence (GetScreeningFacts latency, its Redis cache hit rate, its Postgres); the breaker closes on its own after a successful probe."

      # EXPORTED GAUGE (category 2) — compared against the deployment's own
      # refresh interval, never a literal age: five missed refreshes is stale
      # whatever SCREENING_SANCTIONS_REFRESH_SECS is set to. The synced timestamp
      # is published as 0 before the first successful sync (§15b), so a view
      # that never loaded fires this rather than satisfying it by absence.
      - alert: ScreeningSanctionsViewStale
        expr: |
          (time() - min(screening_sanctions_view_synced_timestamp_seconds))
            / max(screening_sanctions_refresh_interval_seconds) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An API pod's sanctions view has not refreshed from intelligence"
          description: "The pod-local sanctions view (server::sanctions_view) is more than five refresh intervals old. Fresh screening decisions still carry intelligence's own sanctions matches, but a *stale* decision can no longer be vouched for — every stale allow is held as review until the view refreshes (screening_sanctions_refresh_total{outcome=\"failed\"} says why: intelligence unreachable, or the list changing on every walk). If screening_sanctions_view_addresses is 0 the view never loaded."

      # STRUCTURAL — should be zero. The bulkhead refuses intelligence reads
      # past SCREENING_MAX_IN_FLIGHT rather than queueing them; each refusal is
      # answered from a snapshot or fails closed. Sustained refusals mean the
      # pod is running at its concurrency ceiling against a slow intelligence.
      - alert: ScreeningBulkheadRejecting
        expr: sum(rate(screening_bulkhead_rejected_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Screening reads are being refused at the per-pod concurrency ceiling"
          description: "screening_bulkhead_rejected_total has been increasing for 10m: API pods hold SCREENING_MAX_IN_FLIGHT intelligence reads open at once, and further /screen calls skip the fresh read. Usually intelligence is slow (check ScreeningIntelligenceBreakerOpen and GetScreeningFacts latency); if intelligence is healthy, the API deployment needs more replicas or a higher ceiling."

      - alert: ScreeningDegradationDisarmed
        expr: max(screening_degradation_enabled) == 0
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Screening graceful degradation is switched off"
          description: "SCREENING_STALE_MAX_AGE_SECS=0 on the API service: a slow intelligence read holds /screen for the full SCREENING_DEADLINE_MS and then returns 502, blocking the customer's withdrawal, instead of answering from a flagged snapshot. That can be a deliberate compliance choice (no decision on unconfirmed facts) — if so, silence this knowingly; otherwise set a max age."

      - alert: KafkaConsumerLagHigh
        expr: max(kafka_consumer_lag) by (consumer) > 10000
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "A Kafka consumer is falling behind"
          description: "kafka_consumer_lag has stayed above 10000 records for 10m on {{ $labels.consumer }} — the pipeline is backlogging faster than it drains. Check for a stalled/crash-looping consumer before this becomes customer-visible staleness."

      - alert: DlqReceivingRecords
        expr: sum(rate(dlq_published_total[5m])) by (consumer) > 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "A consumer is steadily parking records on its DLQ"
          description: "{{ $labels.consumer }} has published to its mev.dlq.<consumer> topic continuously for 15m — poison messages are accumulating, not a one-off blip. Drain/inspect per the DLQ runbook (production_readiness.md Epic A)."

      - alert: EventStoreAppendErrorsHigh
        expr: sum(rate(event_store_append_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The event store is failing to append"
          description: "event_store_append_errors_total has been increasing for 5m — the audit trail's write path is degraded. A `permanent`-labeled error is a bug (encode failure); `transient` points at ClickHouse. The Kafka ingest retries a failed flush indefinitely rather than commit past evidence it did not store, so while this fires ingest is wedged on purpose: kafka_consumer_lag{consumer=\"event-store\"} climbs, and nothing is lost."

      # Threshold provenance (§19b): derived from the committed capacity model,
      # not typed. 4609990535 = 1.25 × the model's 1× projection of `payload`
      # bytes per day at the end of year one (`just capacity-plan` prints it as
      # the drift ceiling). crates/capacity/tests/committed.rs fails the build
      # if this number and the model disagree, so neither can move alone.
      - alert: EventStoreGrowthAboveCapacityPlan
        expr: sum(increase(event_store_appended_payload_bytes_total[1d])) > 4609990535
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "The event store is growing faster than the capacity plan projects"
          description: "Payload bytes appended over the last day exceed 1.25x the capacity plan's year-one projection. Storage, shard and cost figures in docs/runbooks/capacity-plan.md are now under-estimates. Break the rate down by `event_type` to find which type outgrew its rate in crates/capacity/model.json, correct that rate (or its payload size) from the measurement, re-run `just capacity-plan`, and re-pin this threshold to the new drift ceiling. A duplicate-heavy redelivery storm also inflates this counter; check kafka_consumer_lag first."

      # Structural (§19b): the gauge is a row count the service publishes at
      # boot; any non-zero value is the condition. `for: 7d` because a pending
      # repartition is safe to serve on for weeks — the capacity plan puts the
      # old key's limit years away — but it must not become permanent.
      - alert: EventStoreRepartitionPending
        expr: max(event_store_repartition_pending_rows) > 0
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: "The events table is still on its pre-capacity-plan partition key"
          description: "event_store_repartition_pending_rows has been non-zero for a week: `events` holds data under the daily (chain, event_type, date) key, which the capacity plan shows passing ClickHouse's max_parts_in_total inside the evidence window. Boot will not move data. Run `event-store repartition` for the plan, unsuspend the event-store-repartition Job to move it, then finalize by hand (docs/runbooks/capacity-plan.md §5)."

      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }} is not being scraped"
          description: "Prometheus has failed to scrape {{ $labels.job }} ({{ $labels.instance }}) for 2m — the process is down, unreachable, or its /metrics endpoint hung."

      # REPAIRED. This read `> 30` on a histogram whose top finite bucket is
      # 10s, so `histogram_quantile` could return at most 10 and the rule was
      # incapable of firing — it has been green since it was written, and that
      # green meant nothing. Same defect as the old `FastPathLatencyHigh`, in a
      # different disguise: there, the series could not move; here, the
      # comparison could not be reached.
      #
      # 5.0 is the largest ladder boundary that leaves the expression decidable
      # (at 10.0 the rule is unfireable again, since 10 is also the ceiling),
      # and it is defensible on its own terms rather than being merely the
      # largest legal number: the fast path is MEASURED to reach 1.000s to
      # durable publication under load, and everything after that is the
      # notification consumer's dedup, routing and delivery. Five times the
      # measured publication point is real headroom for one HTTP/SMTP hop and a
      # retry, and any p95 past it means the delivery path, not the pipeline.
      #
      # Honest caveat: the load test does NOT drive notification, so unlike the
      # two rules above this end is reasoned from the measurement rather than
      # measured. It is a bound worth having, not an SLA.
      - alert: AlertEndToEndLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(notification_alert_end_to_end_seconds_bucket[10m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Block → notification latency (p95) is elevated"
          description: "notification_alert_end_to_end_seconds p95 has been above 5s for 10m — the §19 headline end-to-end panel, measured block occurred_at → delivery. Compare against detection_fast_path_duration_seconds: if the fast path is inside its 1s budget then the time is being spent after publication (delivery retries, a slow webhook endpoint, SMTP, or the dedup ledger), and notification_alert_end_to_end_seconds is labeled by `channel` — one bad customer endpoint can carry the whole p95. If the fast path is ALSO high, this is downstream of that and FastPathLatencyHigh is the one to work."

  # ── Model serving + governance (§17, §20.2, §20.5; Sprint 18 t5) ──────
  #
  # These only produce series in a deployment that has an ML bundle mounted
  # (`DETECTION_ANOMALY_CONFIG`); in a heuristic-only cluster every rule below
  # is silent, which is correct — there is no model to govern.
  - name: mevwatch-model-governance
    rules:
      # Recording rule, not an alert: hit rate is *derived* (hits / runs) rather
      # than stored, because a ratio computed from two monotonic counters
      # survives restarts and re-aggregates across instances where a gauge
      # wouldn't (see detection::metrics). Recording it once here means the
      # dashboard, the alerts below and any ad-hoc query all read the same
      # definition instead of three hand-written divisions.
      - record: detector:hit_rate:ratio_rate1h
        expr: |
          sum by (detector, version) (rate(detector_hits_total[1h]))
          /
          clamp_min(sum by (detector, version) (rate(detector_runs_total[1h])), 1e-9)

      # CALIBRATED (category 3). Was 0.25 — "a quarter of the budget", which
      # sounded conservative and was not: the 2026-09-07 run measured the
      # *entire* fast path at a p99 bound of 0.250s with the API idle. A single
      # detector reaching the old threshold meant one detector alone was
      # consuming what the whole block → alert path costs when healthy, by
      # which point the budget is already gone and this has stopped being an
      # early warning.
      #
      # 0.05 is the ladder rung that makes it one again. Nine detectors run per
      # block (sandwich, arb, flashloan, liquidation, rugpull, poisoning,
      # washtrading, anomaly, demo); 9 x 50ms = 450ms still fits inside the 1s
      # §6 budget, so the roster can be fully at this threshold without
      # breaching — it flags the outlier, not the roster. Keep the arithmetic
      # honest when detectors are added or removed.
      #
      # Read it next to the fast-path rules, never alone: the load test's whole
      # lesson is that `detector_detect_duration_seconds` is measured in
      # microseconds on a header-only block and did not move at all during the
      # 4x degradation, because the time was in the queue. A high value here is
      # a real finding; a low one proves nothing.
      - alert: DetectorLatencyBudgetExceeded
        expr: |
          histogram_quantile(0.99,
            sum by (detector, le) (rate(detector_detect_duration_seconds_bucket[5m]))
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.detector }} p99 detect latency is eating the fast-path budget"
          description: "One detector's p99 detect call has been above 50ms for 10m, against a measured healthy whole-path p99 of 250ms. Every detector in the roster runs on the §6 block → alert path, so one outlier at 50ms is the early warning that FastPathLatencyHigh is coming. For the ML detector this is the §20.2 inference budget — cross-check model_inference_duration_seconds. Note this series is deliberately NOT the fast-path SLO: it is one `detect` call and is unmoved by a queue building up in front of it (docs/runbooks/load-test.md), so a quiet value here does not mean the fast path is healthy."

      # STRUCTURAL (a gauge that should be zero). `detector_performance_stale`
      # is 1 when a linked detector build has a stored measurement for a
      # *different* build: its version or config changed and the compiled-in
      # model_performance.json was not regenerated, so its model card says
      # "unmeasured" for a detector that was measured. Published for every
      # linked detector at boot, 0 included (§15b), so a quiet series is a
      # reading, not an absence. It cannot clear without a new image, hence
      # warning rather than page, and a short `for`.
      - alert: DetectorPerformanceCardStale
        expr: max by (detector, version) (detector_performance_stale) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.detector }} v{{ $labels.version }} is running with a stale model card"
          description: "The deployed detection image links a {{ $labels.detector }} build whose (version, config_hash) differs from the one its committed performance record was measured on, so the card shows the detector as unmeasured and §18's measured precision/recall is not attached to its findings. The detector itself runs normally. Fix: run `just backtest-update-baseline` for this build, review the baseline and model-card diff, and ship a new image. The boot log names both builds (look for 'model card unmeasured'). If DETECTION_PERFORMANCE_STORE points at an override file, that file is the stale one."

      - alert: ModelServingSkew
        expr: sum(rate(model_drift_rejected_total[15m])) by (model) > 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.model }} is being served feature vectors its baseline cannot describe"
          description: "model_drift_rejected_total is increasing: the drift monitor is refusing vectors whose feature_version/granularity/arity don't match the training snapshot bound to this model (§20.5 serving/training skew). This is a wiring bug, not a data condition — the boot-time skew check passed, so something is feeding this model the wrong vectors. Any anomaly evidence produced in this window is measured against the wrong distribution."

      - alert: ModelInferenceFailing
        expr: |
          sum by (model, reason) (rate(model_inference_failures_total[10m]))
          /
          clamp_min(sum by (model) (rate(model_inference_calls_total[10m])), 1e-9) > 0.01
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.model }} inference is failing ({{ $labels.reason }})"
          description: "More than 1% of seam calls to {{ $labels.model }} have failed for 10m with reason={{ $labels.reason }}. Every InferenceErrorKind is *permanent* for the input that caused it, so this is not a retry backlog — the detector is silently skipping those candidates (it never fabricates a score). `skew` is a wiring bug; `backend` points at the ONNX Runtime or a poisoned session; `malformed_output`/`score` mean the artifact does not match the output mapping the config declares."

      # The threshold is NOT a literal here. Each deployment sets its own in
      # `anomaly.json`, and the service exports it as `model_drift_threshold` so
      # these rules compare against the number the model was actually judged by
      # (`inference::metrics::DRIFT_THRESHOLD`). A hard-coded `> 3` would be a
      # second definition of the same policy — wrong for any model that tuned
      # its own, and silently stale the moment someone changes the default.
      # Both sides are aggregated by model first, so several replicas of the
      # detection service don't turn this into a many-to-many join.
      - alert: ModelFeatureDriftHigh
        expr: |
          max by (model, feature) (model_feature_drift)
          > on(model) group_left
          max by (model) (model_drift_threshold)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.model }}: feature {{ $labels.feature }} has drifted from its training snapshot"
          description: "The serving-time distribution of {{ $labels.feature }} has sat past this deployment's drift threshold for 30m — its median has moved that many training spreads, or its variance has changed by e^that (see ml_features::drift). §20.5's point is that this is visible *before* precision decays: check the §18 backtest numbers for this model and consider a retrain on a recent window. The durable record is the `ModelDriftDetected` event in the event store, which names the exact (id, version, config_hash) triple that was serving."

      - alert: ModelFeatureDriftSevere
        expr: |
          max by (model) (model_drift_max)
          > on(model)
          (max by (model) (model_drift_threshold) * 2.5)
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.model }} is serving on a distribution it was not trained for"
          description: "This model's worst feature has been more than 2.5x its own drift threshold for 15m — far outside ordinary traffic variation, and heading for the ±32 clamp where a reading saturates. Its scores are no longer measured against a population it has seen, so its precision/recall no longer mean what the registry says they do. Treat as a rollback candidate: a retrained model is a new registry version walking the same Shadow → backtest → Live gate (§20.5), so the fast path here is `deprecated_at` on the current version, not a hot-swap. The multiplier scales with whatever each deployment configured, so this stays 'well past your own line' rather than an absolute nobody tuned."

      # ── Monitoring the monitor ───────────────────────────────────────
      # A drift monitor that has stopped reporting looks exactly like a model
      # with no drift: the gauges simply hold their last value. These two rules
      # are the difference.
      - alert: ModelDriftMonitoringSilent
        expr: |
          sum by (model) (rate(model_inference_vectors_total[1h])) > 0
          unless
          sum by (model) (rate(model_drift_windows_total[1h])) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.model }} is serving but publishing no drift readings"
          description: "This model has scored vectors for an hour without closing a single drift window (§20.5). Expected briefly after a deploy and on a very low-traffic chain — a window needs ml_features::MIN_WINDOW samples before it will report at all, even past its age bound. Sustained for 2h it means monitoring is effectively off: check that `drift.disabled` isn't set in anomaly.json, and check model_drift_skipped_total."

      - alert: ModelDriftObservationsDropped
        expr: sum by (model, reason) (rate(model_drift_skipped_total[30m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.model }} drift observations are being dropped ({{ $labels.reason }})"
          description: "The monitor is failing open — by design, it must never block the fast path — but it is losing data. `contended`: the accumulator lock was held, which today's one-block-at-a-time scheduler should make impossible, so this means the concurrency model changed. `poisoned`: something panicked inside the accumulator; the partial window was discarded and it recovered, but the panic is a bug. `undrained`: readings were evicted before the scheduler drained them, so `ModelDriftDetected` events are being lost."

      - alert: EmbeddingSweepFallingBehind
        expr: sum(rate(intelligence_embedding_sweep_budget_exhausted_total[1h])) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "The behavior-embedding sweep is not finishing its windows"
          description: "The §20.3 sweep hit its per-tick address budget (INTEL_EMBEDDING_SWEEP_BUDGET) and stopped early. It resumes from its cursor on the next tick, so nothing is skipped — but sustained exhaustion means behavior vectors are getting older than one sweep interval. Check intelligence_embedding_sweep_lap_seconds for the actual staleness. Fixes, in order of preference: add shards (raise replicas AND INTEL_EMBEDDING_SHARD_TOTAL together), raise the budget, shorten the interval. A burst after a backfill is expected and self-clears."

      # REPAIRED, and it needed a code change to be repairable at all.
      #
      # This read `histogram_quantile(0.9, ...sweep_lap_seconds...) > 21600`.
      # `intelligence_embedding_sweep_lap_seconds` ends in `_seconds`, so it
      # gets telemetry's shared latency ladder, whose top finite bucket is 10s
      # — a ladder sized for detector calls, holding a quantity measured in
      # hours. Every observation landed in `+Inf`, the quantile could return at
      # most 10, and a threshold of 21600 was unreachable by five orders of
      # magnitude. The staleness SLI Sprint 19 t1 deliberately built has been
      # unwatched since the day it was wired.
      #
      # A lap in hours cannot be expressed on that ladder at any threshold, so
      # the fix is not a number: `intelligence_embedding_sweep_last_lap_seconds`
      # is a gauge (crates/intelligence/src/embedding_sweep.rs), which has no
      # buckets and no ceiling. The histogram stays for the distribution's
      # shape; this rule reads the gauge.
      #
      # 6h is category 1, not 3 — it is the staleness bound similarity search
      # (§20.3, Sprint 19 t2) and the clustering signal (t3) inherit and quote,
      # not something load measured. `max` without grouping is deliberate: with
      # sharding each replica walks its own slice, and the staleness every
      # consumer actually inherits is the slowest shard's, not the average.
      - alert: EmbeddingSweepLapTooSlow
        expr: max(intelligence_embedding_sweep_last_lap_seconds) > 21600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Behavior vectors are going stale faster than the sweep refreshes them"
          description: "The slowest shard's last completed sweep lap exceeded 6h — the staleness bound similarity search and the clustering signal inherit, so past it 'behaves like this actor' is an answer about last week. Unlike EmbeddingSweepFallingBehind this fires even when every tick completes, which is the case where the job looks healthy and is simply too slow. Fixes in order of preference: add shards (raise replicas AND INTEL_EMBEDDING_SHARD_TOTAL together), raise INTEL_EMBEDDING_SWEEP_BUDGET, shorten the interval. NOTE the gauge is written only when a window COMPLETES, so a sweep that has stalled outright holds its last healthy value here — EmbeddingSweepFallingBehind is what covers that, and the two are meant to be read together."

      # ── The §20.3 clustering signal (Sprint 19 t3) ────────────────────
      - alert: ClusteringSignalProposingNothing
        expr: |
          sum(rate(intelligence_link_signal_subjects_total{outcome="searched"}[6h])) > 0
            and sum(rate(intelligence_link_candidates_total{outcome="new"}[24h])) == 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "The clustering signal is searching but proposing nothing"
          description: "Searches are running (the expensive part) and producing zero new candidate links over a day. Usually one of three things, and intelligence_link_signal_suppressed_total{reason} says which: `below_threshold` dominating means INTEL_LINK_MIN_SIMILARITY is set above what this population actually produces; `no_anchor` dominating means the label coverage is too thin for the signal to have anything to anchor on (seed more feeds — §8.1); `already_clustered` dominating means the graph is reaching these addresses first, which is the good outcome and means the signal is buying little here. A silent zero is worth an alert precisely because a signal that proposes nothing looks identical to one that is working."
      - alert: ClusteringSignalSkippingEveryBaseline
        expr: |
          sum(rate(intelligence_link_signal_subjects_total{outcome="no_baseline"}[1h]))
            / clamp_min(sum(rate(intelligence_link_signal_subjects_total[1h])), 1e-9) > 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The clustering signal cannot standardize: no population baseline"
          description: "Over half of subjects are being skipped because no usable population baseline exists for this (chain, embedding_version) — run `intelligence embedding-baseline`, and check intelligence_similarity_baseline_age_seconds. Until it resolves the signal is consuming its topic and proposing nothing, which the queue makes look like 'no links exist' rather than 'nothing was compared'."
      - alert: ClusteringSignalRecoveringLostAnnouncements
        expr: sum(rate(intelligence_link_signal_recovered_total[1h])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Candidate links were stored without their event reaching the bus"
          description: "The boot-time recovery sweep found proposals whose `EntityLinkProposed` was never published and announced them itself. The ordinary crash — commit, then die before publishing — is covered by redelivery and shows up as `intelligence_link_candidates_total{outcome=\"re_announce\"}` instead; reaching *this* counter means redelivery could not have fixed it (a consumer group reset forward, a topic compacted past the event, offsets moved by hand). Not data loss — the row is durable and the sweep published it — but it means something moved the consumer's position, and that is worth understanding before it happens to a topic with no such backstop."

  # ── §20.4 LLM copilot: grounding governance and token cost ──────
  # These alerts watch a machine that writes suspicious-activity reports. The
  # failure they exist for is not an outage: it is a plausible, well-formatted,
  # confidently-cited document that nothing in the record supports.
  #
  # CALIBRATED 2026-09-11 against the audit's actual cadence, which is what
  # "these have never fired against real volume" turned out to mean. The four
  # audit rules read `increase(...[1d])`; the audit is a WEEKLY CronJob
  # (`0 3 * * 0`, deploy/k8s/base/services/copilot-audit.yaml). Two independent
  # defects followed, and either alone was enough to keep them green forever:
  #
  #   - A one-day window over a seven-day cadence. Even for a run that lands
  #     perfectly, its findings sit inside the window for 24 of every 168 hours;
  #     for the other six days the rule reads zero no matter what the audit
  #     found. The window is now [8d] — one full cadence plus slack, so a
  #     result stays visible until the next run replaces it.
  #   - `increase()` needs two samples in the window to return anything at all.
  #     A short-lived Job may be scraped once, or never. `max_over_time()` needs
  #     one, and on a counter from a fresh process that starts at zero it is the
  #     right reading of "what did that run report".
  #
  # Neither fix conjures a series that is never scraped: in Kubernetes the
  # durable signal for a findings run remains the Job failing (exit 1,
  # `backoffLimit: 0`). A `kube_job_status_failed` rule is deliberately NOT
  # added here — kube-state-metrics is not deployed in deploy/, and adding a
  # rule that cannot resolve its own series is the exact defect this pass exists
  # to remove. Deploy kube-state-metrics and that rule becomes worth writing;
  # until then these are the backstop for a scraped or in-process run, and the
  # CronJob's own status is the primary.
  # ── The false-positive SLO (§19, readiness Epic E) ──────────────────────
  #
  # The one number in this file that a *customer*, not the platform, produces.
  # A delivered alert carries a signed capability (`feedback-grant`); the API
  # service verifies it and parks the verdict in `feedback_outbox`; the
  # simulation projection folds it into `incident_feedback`, and exports the
  # gauges below once every refresh interval (simulation::feedback_sli).
  #
  # Three properties make these rules unusual, and all three are deliberate:
  #
  #   * **The rate may be absent.** A window nobody adjudicated has no
  #     false-positive rate — not a zero. The rule below does not fire then,
  #     which is correct: there is nothing to judge.
  #   * **Everything is per cohort.** `sample="volunteered"` is self-selected
  #     (people report what annoyed them) and is a product signal;
  #     `sample="solicited"` comes from incidents the platform picked without
  #     looking at the finding, and is the only one that can back a published
  #     claim. They are never merged, and every series here carries the label
  #     so each rule is a one-to-one match rather than an `on()` join.
  #   * **The SLO declares its arming state.** Too small a sample, or too much
  #     of it from one customer, and `detection_feedback_slo_armed` goes to 0
  #     rather than the series vanishing (§15b).
  #
  # Every threshold is category 2 (an exported gauge): the target, the arming
  # minimum, the concentration cap and the refresh interval are all published
  # by the exporter, so a deployment that retunes one moves its own alerts and
  # this file never carries a second copy of the policy.
  - name: mevwatch-detection-quality
    rules:
      # The SLO itself. Fires only for a cohort whose sample is armed, so a
      # quiet month cannot page anyone — and, for the same reason, never fires
      # on a platform nobody reviews. That blind spot is what
      # FalsePositiveFeedbackUnarmed below exists to cover; the two are a pair
      # and neither is complete alone.
      - alert: FalsePositiveRateAboveTarget
        expr: |
          (detection_feedback_false_positive_rate > detection_feedback_false_positive_rate_target)
          and (detection_feedback_slo_armed == 1)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.sample }} feedback puts the false-positive rate above target"
          description: "detection_feedback_false_positive_rate{sample=\"{{ $labels.sample }}\"} has been above its target for an hour, over a window with enough adjudications to judge. This is the README's accuracy claim, measured in production rather than against fixtures — treat it as a detection-quality incident, not a monitoring one. A `solicited` breach is the serious one: that sample is not self-selected. Start with WHY: alert_feedback_recorded_total is labelled by reason_code, and a spike in `threshold_too_sensitive` on one detector is a config change where `our_own_activity` is a labelling problem. `just feedback-sli` prints the same numbers the alert saw."

      # Monitoring the monitor (§15). An SLO nobody supplies data for is not a
      # met SLO, and the rule above is silent in precisely that case — so the
      # absence of adjudications has to be its own alert or the whole loop can
      # rot quietly. Watched on the volunteered cohort, which is always on;
      # the solicited path has its own rule below.
      #
      # `max_over_time`, not `min_over_time`: the condition is "never armed all
      # week", not "was disarmed at some point". The exporter publishes
      # `slo_armed = 0` before its first read (§15b — the gauge must exist
      # before it can be true), so a `min` over the window would fire on every
      # deployment restart and mean nothing.
      - alert: FalsePositiveFeedbackUnarmed
        expr: max_over_time(detection_feedback_slo_armed{sample="volunteered"}[7d]) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The false-positive SLO has had too little feedback to arm for a week"
          description: "detection_feedback_slo_armed{sample=\"volunteered\"} has been 0 for seven days: the settled window holds fewer than detection_feedback_min_adjudications decided verdicts, so FalsePositiveRateAboveTarget cannot fire whatever the real rate is. Check in order: are alerts carrying feedback links at all (alert_feedback_solicitation_enabled, alert_feedback_solicited_total), are submissions being refused (alert_feedback_refused_total), and did the platform raise anything in the window (detection_feedback_window_incidents). This is the failure mode that reads as success: a green false-positive dashboard on a platform nobody reviews."

      # Sampling bias, made visible. One tenant adjudicating most of the window
      # turns a "platform" rate into one customer's opinion wearing a
      # platform's name — so the SLO disarms rather than quoting it, and this
      # rule says why. Deliberately NOT a reweighting: a winsorized rate is a
      # number nobody can reproduce from the ledger.
      - alert: FeedbackSampleConcentrated
        expr: detection_feedback_top_customer_share > detection_feedback_concentration_cap
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "One customer dominates the false-positive sample"
          description: "A single customer has contributed more than detection_feedback_concentration_cap of the settled window's verdicts, so the false-positive SLO has disarmed itself rather than publish one tenant's opinion as a platform rate. Either the loop has one enthusiastic user and needs more reach, or somebody is deliberately poisoning the sample — `just feedback-sli` names the customer (the metric deliberately does not: an unbounded id set has no business in a time series, §19). Raising FEEDBACK_SLI_MAX_CUSTOMER_SHARE to silence this is a decision about what the number means, not a tuning change."

      # The settle delay, checked against the lag it assumes. The window ends
      # `settle` before now so verdicts have arrived; if the measured p95 lag
      # exceeds that, the window is closing before the evidence lands and the
      # rate is computed from whichever verdicts came fastest — which is not a
      # random sample.
      - alert: FeedbackSettleTooShort
        expr: detection_feedback_lag_p95_seconds > detection_feedback_window_settle_seconds
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "Verdicts are arriving after the SLI window has closed"
          description: "The p95 incident-to-verdict lag is longer than FEEDBACK_SLI_SETTLE_HOURS, so the settled window is being measured before its evidence has landed — and the verdicts that do make it in are the fast ones, which over-represent the obvious false positives. Raise the settle delay to the measured p95 (`just feedback-sli` prints both). This is the parameter that is most tempting to shorten because the dashboard looks stale; the staleness is the measurement working."

      # The exporter's own liveness. Every gauge above is a gauge, so a dead
      # exporter leaves the last values standing indefinitely — indistinguishable
      # from a healthy, unchanging platform, which is the same defect class as a
      # rule that cannot reach its threshold. Six missed refreshes at whatever
      # cadence this deployment configured.
      - alert: FalsePositiveSliStale
        expr: |
          detection_feedback_sli_age_seconds
          > detection_feedback_sli_refresh_seconds * 6
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The false-positive SLI has not refreshed in six cycles"
          description: "simulation-projection has not completed a detection_feedback_false_positive_rate read for six refresh intervals. The gauges are frozen at their last values and the SLO above is now judging stale numbers. Usual cause is ClickHouse: the SLI query joins incident_feedback against incident_analytics, and the exporter deliberately leaves the previous values standing on a read failure rather than zeroing them (a broken store must not read as 'the platform got perfect'). Check the projection's logs for 'false-positive SLI read failed'."

      # STRUCTURAL: a count that should be zero. A refused submission is not
      # yet a lost verdict — the caller saw a 503 and can retry — but it is the
      # loop closing, and the customer who tried is exactly the one least
      # likely to try again.
      - alert: AlertFeedbackRefused
        expr: sum(increase(alert_feedback_refused_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Customers are being turned away when they try to tell us we were wrong"
          description: "alert_feedback_refused_total is rising: the API service could not durably park a verdict, which means Postgres is unreachable or the feedback_outbox insert is failing. The verdict was NOT accepted (the caller got a 503, deliberately, rather than a comfortable 202 over a record we would have dropped). Check the api-service pods' database connectivity first; feedback_outbox_publish_failures_total is the separate, downstream signal for a broker problem, and those rows are safe on disk."

      # Solicitation health: the platform is asking and nobody is answering.
      # Armed by its own gauge so a deployment that does not solicit stays
      # silent rather than firing forever (§15b).
      - alert: SolicitedFeedbackIgnored
        expr: |
          (sum(increase(alert_feedback_solicited_total{cohort="solicited"}[7d])) > 100)
          and (sum(increase(alert_feedback_recorded_total{cohort="solicited"}[7d])) == 0)
          and (max(alert_feedback_solicitation_enabled) == 1)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Nobody is answering the feedback the platform asks for"
          description: "More than a hundred solicited feedback invitations went out in the last week and not one came back, so the only cohort whose rate can back a published accuracy claim will never arm. Usually this is the last mile rather than apathy: check that FEEDBACK_LINK_BASE points at a surface that actually renders the form, that the grant secret matches between notification and the API service (a mismatch shows up as 403s), and that the link is surviving whatever renders the alert."

  - name: mevwatch-copilot-governance
    rules:
      - alert: CopilotFabricatedCitations
        expr: sum(rate(copilot_grounding_rejected_total{reason="fabricated"}[15m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The copilot cited event ids it was never shown"
          description: "copilot_grounding_rejected_total{reason=\"fabricated\"} is non-zero: a narrative cited event ids that were not in the audit window the model was given. The drafts themselves are safe — they land `blocked`, never `ready` — so this pages for the *cause*, not the consequence: a prompt change that stopped demanding full ids, a model swap, or an audit-window read that is returning less than the prompt claims. Check the most recent change to crates/copilot/prompts/ (engineering conventions §16) before assuming the model."

      - alert: CopilotGroundingAuditFindings
        expr: sum(max_over_time(copilot_grounding_audit_drafts_total{verdict=~"unresolved|drifted|unchecked"}[8d])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The grounding audit found stored narratives that no longer check out"
          description: "`copilot audit` re-resolved landed narratives against event-store and found at least one that does not hold: `unresolved` = it cites events the store does not have, `drifted` = the row's grounded_event_ids disagrees with the prose a reviewer reads, `unchecked` = a ready/approved draft the citation boundary never ran on. Any of the three means a document that reads as verifiable is not. Run `just copilot-audit` for the draft ids — the sweep names them, the metric deliberately cannot. NOTE: these series exist only where the sweep runs somewhere Prometheus scrapes; the copilot-audit CronJob is short-lived, so in Kubernetes the primary signal is the Job itself failing (kube_job_status_failed{job_name=~\"copilot-audit.*\"}) — this rule is the backstop for a scraped or in-process run."

      - alert: CopilotGroundingAuditUnverifiable
        expr: sum(max_over_time(copilot_grounding_audit_drafts_total{verdict="evidence_missing"}[8d])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "A retained SAR narrative's evidence is gone from the event store"
          description: "THE RETENTION POLICY HAS BEEN VIOLATED (engineering conventions §18). The audit found a stored narrative whose cited evidence event-store no longer holds, while the narrative itself is still inside its retention window — i.e. the platform is holding a regulatory artifact it can no longer substantiate, and is required to. This is NOT the same as `verdict=\"expired\"`, which is the same observation about an artifact past its deadline and is retention working. Two causes, both actionable: the events table's TTL is shorter than the policy (`event-store retention` prints the store's window next to the policy's — compare with the `event_store_evidence_retention_days` gauge), or evidence was deleted out of band. Run `just copilot-audit` for the draft ids; the metric deliberately cannot name them. Before this alert had a policy to point at it fired on a *share* of unverifiable drafts and could only say the situation might be deliberate; it now fires on one draft, and it is never deliberate."

      - alert: CopilotNarrativesWillOutliveTheirEvidence
        expr: sum(max_over_time(copilot_grounding_audit_at_risk_total[8d])) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Narratives are being kept longer than the evidence under them"
          description: "The leading indicator for CopilotGroundingAuditUnverifiable, and the one with time left on the clock. These drafts resolve perfectly today, but the oldest event each one cites expires BEFORE the draft may be destroyed — so they are already scheduled to become undefendable. Overwhelmingly this means a backfill drafted over an archive older than RETENTION_EVIDENCE_MARGIN_DAYS. The fix is that same variable: raising it lengthens the events table's TTL (event-store reconciles it upward at boot), which is what makes the older archive defendable — it is deliberately one knob, so evidence cannot be under-kept by unlocking an older backfill. `just copilot-audit` prints each draft with `outlives-its-evidence-by=Nd`, which is the number of days to add."

      - alert: CopilotRetentionPurgeStalled
        expr: sum(max_over_time(copilot_grounding_audit_drafts_total{verdict="expired"}[8d])) > 100
        for: 6h
        labels:
          severity: informational
        annotations:
          summary: "Artifacts past their retention deadline are still in the draft store"
          description: "`verdict=\"expired\"` means the audit found a narrative the retention policy has released — the purge was entitled to destroy it and has not. A handful is normal (the purge runs weekly, the audit runs weekly, and they do not run at the same instant). A sustained pile-up means the copilot-retention CronJob is failing or is running without `--apply` (it is a plan by default, on purpose — and the plan reports the full backlog, so a big number there is the honest one), or that a legal hold is preserving them — `copilot retention` prints the held count on every run. Over-retention is a milder failure than under-retention, which is why this is informational, but it is still a policy nobody is keeping."

      - alert: EventStoreRetentionUnreconciled
        expr: absent(event_store_evidence_retention_days) or changes(event_store_evidence_retention_days[1d]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The event store's evidence retention window is unset or just moved"
          description: "`event_store_evidence_retention_days` is the window this deployment BELIEVES it enforces, published at boot from the resolved policy. Absent means no event-store pod has reconciled its TTL — the service refuses to start when it finds a window it cannot safely apply (a narrowing, a first bound over an existing archive, or a TTL clause it could not parse), so an absent series alongside a CrashLoopBackOff is that refusal, and the pod log names the plan. A CHANGE means the window moved: correlate with the `RetentionPolicyChanged` fact in the event store, which carries `destructive` — the bit that separates 'we lengthened retention' from 'we deleted history'. Run `just retention-status` for the store's own answer; the gauge is what the pod thinks, `system.tables` is what is true."

      # Category 2 — the threshold is the deployment's own USAGE_TOKEN_BUDGET,
      # folded into the exported gauge, so there is no literal here to tune.
      #
      # But this alarm has never fired against real volume, and calibrating it
      # turned up the reason: it CANNOT fire as shipped. `usage::budget::run`
      # returns immediately when USAGE_TOKEN_BUDGET is unset or 0, exporting no
      # series at all, and deploy/k8s/ does not set it. So in the default
      # deployment `usage_token_budget_customers` never exists, `max()` over
      # nothing is an empty vector, and the rule is permanently silent. That is
      # the deliberate ships-dark decision (production_readiness.md Epic E), not
      # a bug — but it means A GREEN ALARM HERE IS NOT EVIDENCE OF BOUNDED
      # SPEND, it is the absence of a question. Arming it is a deploy-time act.
      - alert: CopilotTokenBudgetAlarm
        expr: max(usage_token_budget_customers{level="alarm"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A customer's LLM token spend is over the configured budget"
          description: "At least one spender has passed USAGE_TOKEN_BUDGET over the configured window. Nothing has been refused — this platform meters and never gates — so this is a 'look at it' signal, not an incident: a stuck retry loop, a backfill pointed at the wrong window, or genuine heavy use. Run `just usage-budget` to see *who*; the series carries no customer label on purpose (an unbounded id set has no business in a time series, §19). `usage_token_budget_max_ratio` says how far over the worst one is. Silent unless USAGE_TOKEN_BUDGET is set — see CopilotTokenBudgetDisarmed."

      # Once the loop has run, a death leaves the gauges holding their last
      # values while this timestamp goes stale, and the rule fires. The blind
      # spot was a monitor that never armed at all: it exports no timestamp,
      # `max()` over nothing is empty, and this rule was silent about the one
      # state it most needs to distinguish from health. Now that arming is an
      # exported fact, the two states are told apart explicitly — this rule
      # scopes itself to armed deployments, `CopilotTokenBudgetDisarmed` owns
      # the other, and neither can be satisfied by an absence.
      - alert: CopilotTokenBudgetMonitorStale
        expr: |
          max(usage_token_budget_enabled) == 1
          and
          time() - max(usage_budget_last_success_timestamp_seconds) > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The token budget monitor has stopped evaluating"
          description: "No successful budget evaluation for over an hour. The monitor fails open by design (§15) — a ClickHouse blip must not take the metering sink down with it — which is exactly why this alert exists: a monitor that has quietly stopped looks identical to a monitor with nothing to report. Check usage_budget_evaluations_total{outcome=\"failed\"} and the usage service's logs. Until it recovers, CopilotTokenBudgetAlarm is reporting a stale number. Gated on usage_token_budget_enabled == 1, so it is scoped to deployments that actually armed the monitor and cannot be satisfied vacuously by a disarmed one — CopilotTokenBudgetDisarmed covers that case explicitly."

      # The gap the two rules above leave between them, and the reason neither
      # has ever fired. A deployment with USAGE_TOKEN_BUDGET unset has every LLM
      # cost control off, and the two alerts that would say so are both
      # structurally silent, because absence satisfies them.
      #
      # This reads an EXPLICIT arming fact (`usage::budget::BUDGET_ENABLED`,
      # published unconditionally before the disabled-path return), not
      # `absent()`. That was the first cut and it was wrong: `absent()` also
      # fires on a renamed metric, a relabelled scrape job, or a scrape that
      # never landed, and it silently stops working the day anything else
      # exports the name — an alert that infers a fact from a missing series is
      # the same shape of mistake as one that cannot reach its threshold.
      #
      # `informational` would be the easy call and would be wrong — but so
      # would `page`, since shipping dark is the documented default and paging
      # on it would train people to silence it on day one. `warning` with a long
      # `for` is the honest severity: somebody decided not to set a budget, and
      # that decision should be visible and deliberate rather than inherited.
      - alert: CopilotTokenBudgetDisarmed
        expr: max(usage_token_budget_enabled) == 0
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "The usage service is running with no LLM token budget configured"
          description: "usage_token_budget_enabled is 0 — USAGE_TOKEN_BUDGET is unset or 0 and per-customer spend alarms are off (crates/usage/src/budget.rs returns immediately when disabled, after publishing this gauge so the state is a fact rather than an absence). This is the shipped default and is not a fault, but while it holds, CopilotTokenBudgetAlarm and CopilotTokenBudgetMonitorStale are both silent for the same reason and neither is evidence of anything. Check LLM_SPEND_CEILING_TOKENS too — the platform-wide runaway valve ships dark the same way, and is the one that actually bounds a loop (the budget only alarms; nothing here ever refuses a customer, by product decision). Set both in deploy/k8s/ or accept the gap explicitly."

      # The counter whose own doc comment says "Alert on any non-zero rate" and
      # which had no rule — named in production_readiness.md Epic E as the one
      # loose end of the batch-billing fix. Structural, not calibrated: there is
      # no acceptable rate of drafts a batch failed to account for.
      - alert: CopilotBackfillStragglers
        expr: sum(rate(copilot_backfill_stragglers_total[1h])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "A backfill batch returned results that could not be matched to its drafts"
          description: "copilot_backfill_stragglers_total is rising: a batch closed with drafts it never accounted for, released back to the queue so the drain could close the batch. Either the provider's results stream drifted from the wire format this build parses, or `custom_id` minting is wrong. Not data loss — the drafts return to the queue — but it is the symptom of the bug this path was rebuilt around: the open-batch set used to be derived from drafts still in_flight, so a short batch stayed open forever and was re-polled, re-fetched and RE-METERED every lap. Fetch-once is schema now (copilot_batches.results_fetched_at) and the batch closes unconditionally, so a straggler should be rare and never sustained."

  # ── Epic B: disaster recovery — backups, and the proof they restore ──
  #
  # These rules compare two *series* rather than hard-coding a threshold: the
  # `backup` agent exports both the configured budget and the measurement
  # (`backup_objective_seconds{kind="budget"|"measured"}`), so changing a
  # commitment in the deployment changes the alert with it and the two can
  # never drift apart. See docs/runbooks/backup-restore.md.
  - name: mevwatch-disaster-recovery
    rules:
      - alert: BackupRpoBreached
        expr: |
          backup_objective_seconds{objective="rpo", kind="measured"}
            > on(target) backup_objective_seconds{objective="rpo", kind="budget"}
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.target }} has no backup recent enough to meet the RPO"
          description: "The newest artifact for {{ $labels.target }} is older, measured from its *cut*, than the configured BACKUP_RPO. Everything written since that cut would be lost if the store died now — except for event-store data still inside Kafka's retention, which is replayable. Check the backup agent's logs for a failing snapshot (`backup_runs_total{outcome=\"permanent\"}` should have paged already), then disk headroom on the artifact volume. `just backup-snapshot` takes one immediately."

      - alert: BackupSnapshotFailingPermanently
        expr: |
          sum by (target) (increase(backup_runs_total{outcome="permanent"}[1h])) > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.target }}'s backups are failing in a way that will not fix itself"
          description: "A snapshot failed with a PERMANENT classification — the next hundred cycles fail identically, so this pages now rather than waiting for BackupRpoBreached to notice an hour later. Typical causes: a `pg_dump` older than the server after a Postgres upgrade, an unwritable or full artifact volume, a credential change. Contrast `outcome=\"transient\"`, which is the store blipping and is deliberately NOT paged on: the agent retries, and the RPO budget is the backstop if it keeps happening. `outcome=\"cancelled\"` is a rolling deploy and is not a failure at all."

      - alert: BackupSnapshotRetryingPersistently
        expr: |
          sum by (target) (increase(backup_runs_total{outcome="transient"}[6h])) > 6
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.target }}'s backups keep hitting transient failures"
          description: "Individually retryable failures that are not going away. Each one is fine; a steady stream of them means the store is unhealthy or the network is, and the RPO is being held up by luck. Look before BackupRpoBreached fires."

      - alert: BackupArtifactIncomplete
        expr: |
          max by (target) (backup_artifact_incomplete_objects) > 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.target }}'s newest backup does not cover part of the store"
          description: "The snapshot succeeded, the bytes are intact, and part of the store is not in them — so a restore of this artifact restores less than the system holds. This is the one condition under which a *passing* drill would still be bad news, which is why the drill refuses to pass an incomplete artifact at all. Today the only cause is a ClickHouse materialized view declared without an explicit `TO <table>`: its data lives in an inner table whose name embeds a UUID that cannot be recreated in another database. `just backup-list` names the object. Fix the view definition; do not silence this."

      - alert: BackupCyclesSkipped
        expr: |
          sum by (target, job) (increase(backup_cycles_skipped_total[6h])) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.target }}'s {{ $labels.job }} no longer fits its interval"
          description: "A scheduled cycle came due while the previous one was still running, and was skipped rather than stacked. That is the correct behaviour — overlapping snapshots of the same store would contend — but a steady stream of skips means the job has outgrown its cadence, which will surface as an RPO or verification breach later. Lengthen the interval or make the job faster; this is a capacity signal, caught early."

      - alert: BackupDrillFailing
        expr: |
          sum by (target) (backup_drill_divergence_tables) > 0
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.target }}'s backup does not restore as claimed"
          description: "A restore drill restored the newest artifact into a throwaway database and the result did not match the fingerprint taken inside the dump's own cut. This is the failure the whole control exists to catch, and it does NOT show up as a failed backup job — the dump succeeded. The `class` label is the diagnosis: `missing` = the restore did not complete; `unexpected` = the scratch destination was not empty, so the drill measured the wrong thing; `changed` = the restore 'succeeded' and the data differs (check the client/server version pairing in the artifact's manifest first). Runbook §4c."

      - alert: BackupDrillStale
        expr: |
          backup_objective_seconds{objective="verification", kind="measured"}
            > on(target) backup_objective_seconds{objective="verification", kind="budget"}
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.target }}'s backups have not been proven restorable recently"
          description: "No restore drill has passed for {{ $labels.target }} within BACKUP_DRILL_MAX_AGE. Snapshots may well still be landing — that is exactly why this is a separate alert: an untested backup is a belief, not a control, so the RPO figure currently on the dashboard is unsupported. Check `backup_drill_runs_total{outcome=\"failed\"}` (the drill ran and failed — see BackupDrillFailing) versus no drill series at all (the agent is not running one)."

      - alert: BackupRtoBreached
        expr: |
          backup_objective_seconds{objective="rto", kind="measured"}
            > on(target) backup_objective_seconds{objective="rto", kind="budget"}
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.target }}'s measured restore time is past the RTO budget"
          description: "The last passing drill's wall clock, plus the declared BACKUP_ORCHESTRATION_OVERHEAD, exceeds BACKUP_RTO. Restore time grows with the data, so this is expected to fire eventually and is a capacity signal, not a fault: either the commitment needs revising or the restore path needs to get faster (parallel restore, faster artifact storage). Note the measured half is real and the overhead half is an estimate a human wrote down — revisit both."

      - alert: BackupArtifactShrank
        expr: |
          backup_artifact_bytes < 0.5 * (backup_artifact_bytes offset 1d)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.target }}'s newest backup is less than half the size it was yesterday"
          description: "A backup that succeeds and writes far less than usual is the classic silent failure: a table dropped from the dump, a filtered read, a truncated write. The drill would catch it only if the fingerprint was taken outside the same cut — it is not, so a shrunken-but-internally-consistent artifact passes. This is the independent check on volume. Compare `backup_artifact_rows` and read the artifact's manifest notes (`just backup-list`)."

      - alert: BackupAgentAbsent
        expr: absent(backup_artifact_age_seconds)
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Nothing is reporting on backups"
          description: "No `backup_artifact_age_seconds` series is being scraped at all. This is the failure mode a CronJob-based backup cannot report on itself and the reason the agent is a long-running Deployment: a job that was deleted, scaled to zero, or never deployed produces no metric, which looks identical on a dashboard to a healthy one. Until this clears, every other rule in this group is silent — there is no evidence either way about whether the platform can be recovered."

  # ── Simulation autoscaling (Epic D; §7, §20) ──────────────────────────────
  #
  # The worker pool scales on the backpressure signal §7 designed for it, not
  # on CPU alone. The HPA (deploy/k8s/base/services/simulation.yaml) reads the
  # recording rule below through prometheus-adapter (deploy/k8s/cluster/).
  #
  # Nothing here is a literal. The unit is `simulation_worker_job_capacity` —
  # workers x prefetch, the bound each replica already declares — so the
  # scaling point is an EXPORTED GAUGE (category 2): retune the prefetch and
  # the autoscaler follows. ready + unacked, not ready alone: RabbitMQ only
  # holds a message ready once every consumer's prefetch window is full, so
  # (ready + unacked) / capacity is the number of replicas needed to hold the
  # whole queue inside declared bounds. Against an HPA AverageValue of 1 that
  # exceeds the current count exactly when backpressure has engaged — ready
  # alone would ask for fewer replicas than are already working the backlog.
  #
  # `min` capacity: mid-rollout of a prefetch change, err toward more replicas
  # (the same direction the HPA fails when this series is missing — it holds
  # and never scales down on a metric it cannot read).
  - name: mevwatch-simulation-autoscaling
    rules:
      - record: simulation:sim_jobs_replicas_demanded
        expr: |
          (
              sum(rabbitmq_queue_messages_ready{queue="sim.jobs"})
            + sum(rabbitmq_queue_messages_unacked{queue="sim.jobs"})
          ) / min(simulation_worker_job_capacity)

      # STRUCTURAL: two series that contradict each other. Demand above the
      # replicas actually reporting, by more than the HPA's own 10% tolerance,
      # is a state the autoscaler exists to remove. It reacts within a sync
      # period plus pod start (the worker's startup budget is 150s), so 15m of
      # it is not lag — it is the autoscaler unable or not permitted to act.
      - alert: SimulationBacklogOutgrowingWorkers
        expr: |
          simulation:sim_jobs_replicas_demanded
            > 1.1 * count(simulation_worker_job_capacity)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "sim.jobs needs more worker replicas than are running"
          description: "simulation:sim_jobs_replicas_demanded ((ready + unacked) / per-replica job capacity) has exceeded the number of worker replicas reporting capacity for 15m. Incident confirmation is falling behind the fast path. `kubectl -n mev describe hpa simulation-worker` names which: ScalingLimited = at maxReplicas (raise it in the overlay — this is capacity, not a fault); FailedGetExternalMetric = the adapter or Prometheus cannot serve the signal; replicas desired but pods Pending = the cluster has no room for a 1-CPU worker. Nothing is lost while this fires — jobs wait in a durable quorum queue — but a backlog older than the reorg window simulates blocks the dispatcher may already have retracted."

      - alert: SimulationQueueSignalDown
        expr: up{job="rabbitmq"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ's metrics endpoint is not being scraped"
          description: "The `rabbitmq` scrape target (:15692, /metrics/per-object) has been down for 5m. sim.jobs depth is the simulation worker autoscaler's input, so the HPA is running on CPU alone and will not scale down: it holds replicas rather than act on a metric it cannot read. The simulation dashboard's queue panels and SimulationBacklogOutgrowingWorkers are blind for the same reason. Check the broker pod and that the rabbitmq_prometheus plugin is still enabled."

      # STRUCTURAL: a count that is zero while the pool can still grow. The
      # dispatcher is refused only once sim.jobs holds its byte bound
      # (RABBITMQ_SIM_MAX_LENGTH_BYTES), and the bound is hundreds of times the
      # pool's in-flight capacity at maxReplicas, so a sustained rate means the
      # autoscaler is already pinned. Nothing is lost: each refused alert stays
      # uncommitted on Kafka and is retried.
      - alert: SimulationQueueAtBound
        expr: sum(increase(simulation_dispatch_rejected_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "sim.jobs is full; the simulation backlog has moved to Kafka"
          description: "The dispatcher's publishes are being nacked because sim.jobs is at its length bound (x-overflow=reject-publish). Each refused alert is left uncommitted and retried, so the backlog now shows as consumer lag on the dispatcher group rather than queue depth. No alert is lost, but incident confirmation is capped by the worker pool. Check SimulationBacklogOutgrowingWorkers and `kubectl -n mev describe hpa simulation-worker` (ScalingLimited = raise maxReplicas in the overlay). Raising the bound only delays this; it does not add capacity."

      # STRUCTURAL: a count that should be zero. Each overrun is resolve or revm
      # work thrown away and requeued, and x-delivery-limit dead-letters a job
      # that overruns on every delivery.
      - alert: SimulationJobsMissingDeadline
        expr: sum by (stage) (increase(simulation_jobs_deadline_exceeded_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Simulation jobs are running past SIMULATION_JOB_DEADLINE_SECS ({{ $labels.stage }})"
          description: "Jobs are being requeued because they exceeded the per-job deadline. stage=\"resolve\": the resolver (the RPC fork) is slow or hanging. stage=\"simulate\": revm is slow, either overloaded workers (check CPU against the HPA's 70% target) or bundles near the gas caps. Every overrun is wasted work, and a job that overruns on each of its x-delivery-limit deliveries lands in sim.jobs.dlq. Do not raise the deadline without raising terminationGracePeriodSeconds; crates/simulation/tests/grace_period.rs enforces the relationship."

      # PUBLISHED CLAIM of the grace-period budget: it assumes a simulation stops
      # at most worker::DEADLINE_OVERSHOOT_ALLOWANCE (5s) after its deadline. The
      # deadline is checked between transactions, so the overshoot is one
      # transaction's run time, and this is the measurement of that assumption.
      # Above it, a draining worker can be SIGKILLed before its job settles.
      # 5.0 is a latency-ladder boundary.
      - alert: SimulationDeadlineOvershootAboveAllowance
        expr: |
          histogram_quantile(0.99,
            sum(rate(simulation_job_deadline_overshoot_seconds_bucket[1h])) by (le)
          ) > 5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "One transaction past the deadline takes longer than the grace budget allows"
          description: "simulation_job_deadline_overshoot_seconds p99 is above the 5s DEADLINE_OVERSHOOT_ALLOWANCE that terminationGracePeriodSeconds is derived from. A single transaction is running for more than 5s after its job's deadline, so a worker drained during such a job can be killed before it settles, redelivering it into another full run. Lower SIMULATION_PER_TX_GAS (it bounds one transaction's run time), or raise the allowance and the grace period together; tests/grace_period.rs checks the sum."

  # ── Event delivery (event-bus) ─────────────────────────────────────────────
  - name: mevwatch-event-delivery
    rules:
      # STRUCTURAL: a count that should be zero. A permanent publish failure is
      # an event the platform built and can never encode, a bug in our own
      # types, and it fails identically on every retry. Consumers skip and
      # dead-letter the record, and fire-and-forget producers drop the event, so
      # this counter is the only place the loss is visible. Shutdown
      # abandonments are the normal cost of drains and are deliberately not
      # alerted on here.
      - alert: EventPublishPermanentlyAbandoned
        expr: sum by (event_type) (increase(event_publish_abandoned_total{reason="permanent"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.event_type }} events cannot be encoded and are being dropped"
          description: "event_publish_abandoned_total{reason=\"permanent\"} is rising for {{ $labels.event_type }}: publish_resilient hit an encode failure, which retrying cannot fix. Consumer-side, the triggering record was skipped and parked on its DLQ (replay after the fix). Producer-side (ingestion, predictive, drain_to_backbone), the event is gone. Look for EventError in the service's logs; the usual cause is a schema_version the running build does not support."
