name: PR & Branch Validation

# Fast feedback on every pull request AND every push to a non-main branch, so
# work-in-progress on a feature branch is checked even before a PR is opened.
# The full gate (security, bench-smoke, integration) + image publish runs only
# on main / version tags via ci.yml — never from a feature branch.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    # main (and v* tags) are handled by ci.yml's full gate; everything else
    # gets these fast checks. branches-ignore doesn't match tags.
    branches-ignore:
      - main

# Collapse the push + pull_request events that both fire once a branch has an
# open PR into a single run: normalize the group to the source branch name
# (`head.ref` on PR events, `ref_name` on push events) so the duplicate is
# cancelled instead of running twice.
concurrency:
  group: pr-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SQLX_OFFLINE: "true"

jobs:
  # ── Fail fast: fmt, clippy, and a locked build ───────────────────
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # --locked fails if Cargo.lock is stale/uncommitted — the Rust analog of
      # the `go mod tidy` diff check.
      - name: cargo build (locked)
        run: cargo build --workspace --all-features --locked

  # ── Event schema compatibility (§2, readiness Epic B) ────────────
  # The committed schema of every DomainEvent, regenerated from the real codec
  # and diffed against crates/events/schema/v<SCHEMA_VERSION>/. Fails on:
  #   * compatible drift (a new event type, a new defaulted field) — re-commit
  #     the schema with `just schema-bless`, reviewed like any other diff;
  #   * incompatible drift (a removed/retyped/newly-required field, a removed
  #     event type) — blessing refuses, and it needs a SCHEMA_VERSION bump plus
  #     an upcaster (crates/events/SCHEMA.md).
  # It also replays the append-only archive (schema/corpus/ — every distinct shape
  # ever emitted, including ones no current code can produce) through today's
  # reader: the check that keeps a producer and a consumer deployable
  # independently, and history readable.
  schema-compat:
    name: Event schema compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - name: Registry diff + archive replay
        run: cargo test -p events --all-features --locked --test schema_registry

  # ── Backtest gates: no regression (§18), nothing live below the
  # promotion floor (§20.2) ────────────────────────────────────────
  backtest:
    name: Backtest P/R gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - name: Replay fixtures, compare to both committed gates
        run: cargo run -p backtest --all-features --locked
        # Fails the PR on either of two independent conditions:
        #   * a detector's measured precision/recall dropped below
        #     crates/backtest/baseline.json (the regression gate). An
        #     intentional change updates the baseline in the same PR via
        #     `just backtest-update-baseline`, reviewed like any other diff.
        #   * a `LifecycleStatus::Active` detector sits below
        #     crates/backtest/promotion_gate.json, or has no measurement at
        #     all (the promotion gate, §20.2). That file has no --update
        #     flag on purpose: moving a governance floor is a hand edit.
        # Shadowed detectors that clear the promotion gate are reported as
        # promotable and never fail the build — promotion is a human step.

  # ── Coverage → Codecov ───────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}   # repo secret; optional for public repos
          files: lcov.info
          fail_ci_if_error: false                # don't block the PR on Codecov hiccups
